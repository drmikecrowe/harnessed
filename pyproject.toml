[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessed"
version = "0.1.0"
description = "harnessed — composable AI-coding-harness stacks (host Python CLI driving podman)"
requires-python = ">=3.12"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "rich>=14,<15",
    "pip-audit==2.10.1",
    "typer>=0.12,<1.0",
]

[project.scripts]
harnessed-tools = "harnessed.cli:main"
harnessed = "harnessed.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "jsonschema>=4",
    # Analysis tooling, declared HERE rather than relied on from a developer's PATH: a check that
    # only runs where someone happens to have the binary installed produces evidence nobody else
    # can reproduce, and CI cannot run it at all. Each entry below replaces something that was
    # otherwise hand-rolled as a one-off script, or a gauntlet layer previously reported as
    # unavailable because nothing here declared a tool to run.
    "ruff>=0.16",     # lint; its `S` rules ARE flake8-bandit, so no separate bandit dependency
    "mutmut",         # mutation testing generated from the AST — no hand-written mutants to rot
    "diff-cover",     # coverage restricted to the lines a branch changed
    # Added for bd harnessed-rv2, each closing a gauntlet layer that was being reported UNAVAILABLE
    # for want of a declared tool — the same reason the three above exist.
    "hypothesis>=6",       # property-based tests: invariants over inputs nobody thought to enumerate
    "pytest-randomly>=3",  # randomized test order. Every count this suite reports rests on it being
                           # deterministic, and 2200 tests is well past where order-dependence stays
                           # visible by inspection.
]

[tool.mutmut]
# Mutation testing: does a test FAIL when the code is broken, or does it merely execute the line?
# Coverage cannot tell those apart, which is why a 100%-covered change can still be untested.
# Declared here rather than passed ad hoc so the layer is reproducible by CI and by the next agent
# — `mutmut run` with no arguments mutates everything; scope a single change with
# `mutmut run "harnessed.<module>.x_<function>*"`, and read results with `mutmut results`.
# WARNING: the `src.` prefix and missing `x_` are wrong. mutmut names mutants
# `harnessed.<module>.x_<function>__mutmut_N` — no `src.` prefix, `x_` before the function.
# A non-matching filter is silent: mutmut exits 0, generates the tree, and `mutmut results`
# prints every mutant as `not checked` — which looks like a clean run, not a missed filter.
paths_to_mutate = ["src/harnessed/"]
tests_dir = ["tests/"]
# The suite imports `support` and `conftest` as top-level modules from tests/, so the whole dir has
# to land in the mutants tree — a file-by-file `also_copy` fails, since mutmut does not create the
# parent dirs. The suite is podman-GATED, not podman-driven (tests/conftest.py): a mutant must be
# killed by a test that runs WITHOUT a container, or the score measures the gate, not the tests.
#
# The list is wider than it looks like it should be because this suite asserts against REPO ASSETS,
# not only against `src/`: workflow YAML, the catalog, the shell scripts under tools/. Those tests
# resolve paths relative to the tree root, so anything they read has to exist in the mutants tree or
# they error at collection and every mutant reports "survived" for want of a runnable suite.
also_copy = ["tests/", ".github/", "catalog/", "tools/", "schemas/", "mise.toml", "README.md"]
#
# TWO KNOWN LIMITATIONS, both found by running this (bd harnessed-rv2), both affecting only the
# asset-asserting tests and not the mutation score of any function:
#
#  1. `harnessed_home()` resolves through the `src/harnessed/catalog` SYMLINK, which does not exist
#     in the mutants tree. Export `HARNESSED_DIR=$PWD` when running mutmut.
#  2. mutmut's copy DEREFERENCES symlinks, so `catalog/*.local` arrive as real dirs and the few
#     tests that assert a link IS a link fail there. Scope a run past them by narrowing `tests_dir`
#     to the test files covering the change — which is the right scoping for a targeted run anyway:
#       HARNESSED_DIR=$PWD mise exec -- uv run --extra dev mutmut run "*<function>*"

[tool.ruff]
line-length = 100
# The FLOOR of requires-python, not the newest interpreter around. target-version tells ruff which
# syntax and stdlib are legal; set to py313 it green-lights 3.13-only constructs that break on the
# 3.12 this project claims to support and CI runs. That is the same defect shape as bd
# harnessed-925 — a check that measures a version nobody ships.
target-version = "py312"

[tool.ruff.lint]
# Correctness and security, not style. Formatting is deliberately NOT enforced: this codebase's
# layout is hand-tuned and reformatting it would bury real findings under thousands of diffs.
#   E9  syntax and IO errors        F    pyflakes (undefined names, unused imports)
#   B   bugbear (real bug shapes)   S    flake8-bandit — this IS bandit
#   PLE pylint errors only          RUF  ruff's own correctness rules
#   BLE blind `except Exception`
#
# BLE is here for a reason worth writing down: this codebase already marks its deliberate blind
# excepts with `# noqa: BLE001`. Leaving BLE out of `select` does not make those comments harmless
# — it makes RUF100 report them as UNUSED, and "fixing" that would strip the markers before the
# rule they document was ever switched on. Enabling it costs 2 findings and keeps 3 deliberate
# suppressions meaningful.
select = ["E9", "F", "B", "S", "PLE", "RUF", "BLE"]
ignore = [
    # This tool's entire job is driving podman, git and mise as subprocesses. Both rules fire on
    # every such call and neither describes a defect here; silencing them project-wide keeps the
    # remaining `S` findings meaningful instead of drowning them 226-to-1.
    "S603",  # subprocess call without shell=True
    "S607",  # partial executable path — binaries are resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # `assert` is what a test suite is made of (2464 of them)

[tool.ruff.lint.flake8-bugbear]
# B008 fires on a function call in an argument default, because the usual such call builds a shared
# mutable that every invocation then aliases. `typer.Option`/`typer.Argument` are the opposite: they
# return an immutable descriptor that Typer reads ONCE to build the CLI parser, and declaring them
# in the signature is the only supported way to write a Typer command. Listing them here says "these
# calls are immutable" rather than muting B008, so the rule still fires on a genuine mutable default.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src", "tests", "tools"]
# `tests/` holds `support.py` and `conftest.py`, imported as TOP-LEVEL modules by the suite —
# pytest is told so by `pythonpath = ["tests"]` below, but that setting is pytest's alone and
# pyright never reads it. Whether pyright resolves `import support` was therefore left to the
# environment, and it does not resolve the same way everywhere: measured on this tree at 60 errors,
# and at 168 in a fresh worktree where it could not find the module — a ~100-error swing that is
# pure phantom, sitting in the layer a CI gate is supposed to hold at a fixed number. Declaring the
# path here removes the degree of freedom instead of documenting it.
extraPaths = ["tests"]
pythonVersion = "3.12"  # the floor, for the reason spelled out under [tool.ruff]
# `basic`, not `strict`. Measured on this tree: 14 errors across the 36 files of src/, 84 across
# all 128 files once tests/ and tools/ are included — the include list above is wider than src/,
# so 84 is the number this config actually reports. `strict` would report far more and become a
# number nobody looks at.
typeCheckingMode = "basic"
# src/harnessed/catalog is a symlink to the repo-root catalog/ directory, which contains
# container-side scripts — they execute inside recipe images against dependencies (mcp, starlette,
# uvicorn) that this host package deliberately does not install and should not install. Checking
# them on the host produces only noise (reportMissingImports for every container dep) and measures
# nothing about the code that actually runs here. The exclude entry below drops the symlink target
# from pyright's walk so those 5 findings never appear. In pyright, exclude overrides include, so
# listing a subpath here correctly narrows the src/ include without any wider side-effect.
exclude = ["src/harnessed/catalog"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harnessed*"]

[tool.setuptools.package-data]
# Ship the catalog INSIDE the wheel, so an installed harnessed (uv tool / pipx / PyPI) carries its
# own recipes, agents, services, stacks and base Dockerfiles and needs no repo on disk.
# `src/harnessed/catalog` is a symlink to the repo-root `catalog/` — the authoring surface stays
# where it has always been, and setuptools materializes it here as real files. See
# `paths.harnessed_home`, which resolves through the symlink so the podman build context is always
# a REAL directory containing a REAL catalog/ (podman rejects symlinks escaping the context).
harnessed = ["catalog/**/*"]

[tool.setuptools.exclude-package-data]
# Keep HOST-LOCAL, gitignored artifacts out of a distributed wheel. Both of these live inside
# catalog/ and would otherwise be swept up by the glob above:
#   *.local          — symlinks into the user's PRIVATE overlay (~/.config/harnessed/catalog/...)
#                      created by _ensure_local_catalog_links. setuptools follows symlinks, so
#                      without this a `uv build` in a dev checkout would publish the user's own
#                      recipes inside the wheel.
#   extra-tools.txt  — the user's resolved mise tool list, staged into the build context by
#                      _ensure_extra_tools. The committed seed (extra-tools.default.txt) SHIPS;
#                      the resolved per-user file must not.
#   recipes.backlog  — recipes parked as untested. `find_in_catalog` only ever looks at
#                      catalog/recipes, so these are already unresolvable; keeping them out of the
#                      wheel means an installed harnessed carries no half-finished recipe at all.
harnessed = [
    "catalog/*.local",
    "catalog/*.local/**/*",
    "catalog/base/extra-tools.txt",
    "catalog/recipes.backlog/*",
    "catalog/recipes.backlog/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/support.py holds helpers shared across test modules; make it importable as `support`.
pythonpath = ["tests"]
