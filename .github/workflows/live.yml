name: live verification

# The home for the live layer (bd harnessed-3x1).
#
# `tests.yml` is hermetic by design — no podman on the runner, so every HARNESSED_PODMAN-gated test
# skips. That was the whole defect: the live-verification tests existed, ran nowhere, and each run
# printed a reassuring skip count while nothing exercised a real container. A skip is not a pass.
#
# NOT on pull_request, deliberately. These tests run `podman build`; adding minutes to every PR
# would get the job disabled within a week, and a disabled check verifies exactly as much as a
# skipped one. Post-merge plus a nightly run catches drift in the external contracts (podman's
# inspect/port/images output formats, and everything in bd harnessed-rwt) within a day, which is
# the timescale those actually change on.
#
# NO LONGER MANUAL-ONLY. The automatic triggers below were held back because opening the gate for
# the first time showed the live layer did not pass, and scheduling a nightly job against a suite
# that is red from day one produces a check people mute within a week — which verifies exactly as
# much as the skip it was meant to replace. Four defects stood in the way, all now fixed:
#
#   harnessed-ng5  tests linked the repo's `catalog-local/` at their own tmp catalog and left the
#                  links behind, failing every test after the first (PR #213)
#   harnessed-lxw  the capability sweep called `build`/`test` with no harness — a usage error, so
#                  all 7 parametrizations failed in 27s without podman doing any work
#   harnessed-1o4  the persist round-trip built `claude_context-mode`, a stack that has never
#                  existed under any naming scheme, and called `launch_headless` without a harness
#   harnessed-2c4  `uvx mcp-server-time` floated onto mcp 2.0.0, which renamed `McpError` — the
#                  shipped `time` recipe's server died at import in every container
#
# Measured on a real podman before enabling these: `HARNESSED_PODMAN=1 pytest` → 2166 passed,
# 1 skipped (the one remaining skip needs a dolt binary, bd harnessed-3x1 note).
#
# STILL NOT on `pull_request`. A PR that touches the build or launch path runs this layer ON
# DEMAND, against its own branch:
#
#   gh workflow run live.yml --ref <branch>
#   gh run watch "$(gh run list --workflow live.yml --branch <branch> -L1 --json databaseId -q '.[0].databaseId')"
#
# That is the whole mechanism. It covers the gap the automatic trigger was reaching for — a
# REGRESSION, as opposed to external drift; PR #461 was one approval from merging with six podman
# tests red — without charging two container-runtime jobs to every PR, including the ones that
# change only docs or tests. Ad hoc is a judgement call the author makes; the automatic run on
# `main` and the nightly still catch what the author does not.
#
# Both runtimes gate here. "Supported" that is not continuously verified is a claim, not a fact,
# and harnessed claims both podman and docker.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"     # 04:00 UTC: contract drift found next morning, not by a user

jobs:
  live:
    runs-on: ubuntu-latest
    # 30 was thin: observed runtimes 15:03, 14:41 and 23:47, so run 31133464515 came within six
    # minutes of being killed — and a timeout kill presents as an unrelated failure, which is the
    # worst way for this job to go red. mise now also provisions shellcheck and pyright on a cold
    # runner, widening the gap further (bd harnessed-rv2.3).
    timeout-minutes: 60
    steps:
      # PINNED TO COMMIT SHAs, not tags. A git tag is mutable — whoever controls the action can
      # repoint `v5` at different code, and this job runs with a token on a runner that has just
      # been told to install software. The repo already requires this of every other download
      # ("Pin every download — no @latest", CLAUDE.md); an action is a download that executes.
      # Comments carry the human-readable version so the pins can be refreshed deliberately.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Setup uv (+ Python 3.12)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"

      # `tools/run-tests.sh` shells out to mise on its first line, so without this the job dies with
      # "is mise installed and on PATH?" having run nothing.
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          # Pinned, per CLAUDE.md. This is the version this change was verified against locally
          # (`mise --version` → 2026.8.2 linux-x64); bump it deliberately, not by drifting to latest.
          version: 2026.8.2

      # Verified, not assumed: this job's entire value is that podman is really here. If the
      # runner image ever drops it, this step fails loudly rather than letting the suite skip its
      # way to a green tick.
      - name: Ensure podman is available
        run: |
          podman --version || {
            sudo apt-get update
            sudo apt-get install -y podman
          }
          podman --version
          podman info >/dev/null

      # `aoe` is deliberately NOT provisioned. ARCHITECTURE.md and src/harnessed/aoe.py both say
      # harnessed "neither requires nor installs" it, and its tests carry no `live_podman` marker,
      # so they are reported and never fail the run. That skip is a declared choice, not a gap.
      #
      # `dolt` IS provisioned, by `mise.toml` rather than by a step here — see the note there. It
      # was installed on the author's machine but undeclared, so the suite skipped its test even
      # where the binary existed (bd harnessed-ln7).

      # BEFORE pytest STARTS, not merely before those tests run. `test_live_verification_debt.py`
      # skips two `@podman` tests unless `localhost/harnessed-base:latest` exists, and evaluates
      # that at COLLECTION time. The capability sweep later in the suite does build the image, which
      # is why this looked like it should already work — but by then the skip decision is made. Both
      # tests therefore skipped on every run this workflow has ever done, and because they carry the
      # `live_podman` marker they are what failed run 31205617563, not the aoe and dolt gates that
      # the report listed (bd harnessed-ln7).
      # BARE `build`, not `build default claude`. Adversarial review caught the first version doing
      # far more than its own name: `build <stack> <harness>` also builds the agent and derived
      # images, runs the credentialed supply-chain rescan, and creates the stack's podman volumes —
      # work the capability sweep does again inside pytest, in a separate process where the
      # build-once cache cannot deduplicate it. Creating stack volumes before the tests that
      # exercise volume creation would also mask a cold-start failure.
      #
      # `_build_images_cmd` (what bare `build` runs) builds exactly the base and agent images and
      # then reconciles stacks, which is a no-op on a fresh runner.
      # GITHUB_TOKEN is REQUIRED here, not a nicety. mise's aqua backend resolves several pinned
      # tools through api.github.com, and an unauthenticated runner shares one heavily-used IP
      # rate-limit pool. When it runs out the API answers 403 and the build dies mid-layer:
      #
      #   mise ERROR Failed to install aqua:cli/cli@2.96.0: HTTP status client error
      #   (403 Forbidden) for url (https://api.github.com/repos/cli/cli/releases/tags/v2.96.0)
      #
      # That reads as a broken pin — the pin is fine, the request was refused. The workflow token is
      # already present in the job; passing it raises the limit from 60/hr per IP to 1000/hr per
      # repo and needs no secret to be configured. Read-only: it authenticates public release
      # lookups, nothing more.
      - name: Build the base image the live tests require
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- uv run --extra dev harnessed build

      # WHY THIS EXISTS: the two bugs that kept this job red for six consecutive runs were both
      # claims about the runner's environment that no log here could confirm or refute.
      # harnessed-rv2.1 turned on the runner's uid — never printed — and harnessed-rv2.2 on whether
      # hatago's child servers spawned at all. One `id -u` settles the first; the report now carries
      # the hatago log for the second. Before the suite, deliberately: a diagnostic that only runs
      # after a passing suite diagnoses nothing.
      - name: Runner identity
        run: |
          echo "uid=$(id -u) gid=$(id -g) user=$(id -un)"
          id -u
          id -g
          podman info --format '{{.Host.IDMappings}}'
          # `tools/run-tests.sh` resolves its venv through mise's `_BRANCH`, which is
          # `git branch --show-current`. Whether actions/checkout leaves a local branch or a
          # detached HEAD decides whether that is "main" or "" — and an adversarial review and I
          # reached opposite conclusions from documentation alone. Neither of us can settle it
          # without a run, so print it and let the run settle it. Empty is not a failure: the venv
          # path just collapses to a shared one (bd harnessed-rv2.3).
          echo "branch=$(git branch --show-current) UV_PROJECT_ENVIRONMENT=${UV_PROJECT_ENVIRONMENT:-<unset>}"

      # THROUGH tools/run-tests.sh, not a hand-composed pytest line. CLAUDE.md: the script "absorbs
      # three traps that fail locally while CI stays green" (per-branch venv outside the repo, the
      # mandatory `--extra dev`, and mise's untrusted-config refusal). Invoking pytest directly meant
      # CI and a developer's box were not running the same thing by construction — bd harnessed-rv2.3.
      #
      # The suite's own guard (tests/conftest.py) fails the run if HARNESSED_PODMAN=1 is set and
      # the podman-gated tests skip anyway — so a broken podman cannot masquerade as success here.
      - name: Run the live-verification layer
        env:
          HARNESSED_PODMAN: "1"
          # Same reason as the build step: the live tests build STACK images, whose `tools:` are
          # installed at container runtime through mise — so they hit api.github.com too, and an
          # unauthenticated 403 here fails a test rather than the build, which is harder to read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # FOUR TESTS DESELECTED BY NAME, tracked in #462. `varlock proxy rules` stopped parsing for
        # `_varlock_proxy_modes` on 2026-08-28 and this job has been red on `main` ever since —
        # upstream display drift, unrelated to anything in this repo, and the parser is failing
        # CLOSED exactly as designed.
        #
        # Leaving them in is not a cosmetic cost: a failed step ENDS THE JOB, so the launch step
        # below never ran. The job that exists to prove a podman stack reaches a running agent was
        # proving nothing instead, for a reason no PR author could act on.
        #
        # Named one by one rather than deselecting the class, the file, or the marker, so a NEW
        # failure anywhere in that module still goes red. Delete these four when #462 closes — and
        # note that its acceptance criteria keep `_varlock_proxy_modes` returning None on untrusted
        # output rather than widening the parser to swallow the drift.
        run: |
          tools/run-tests.sh -v \
            --deselect "tests/test_external_contracts_live.py::TestVarlockProxyRulesOutput::test_every_mode_the_parser_knows_is_produced_by_the_real_binary" \
            --deselect "tests/test_external_contracts_live.py::TestVarlockProxyRulesOutput::test_the_gate_and_the_binary_agree_on_what_counts_as_opting_in" \
            --deselect "tests/test_external_contracts_live.py::TestVarlockProxyRulesOutput::test_a_schema_with_no_annotation_still_reports_modes_when_asked" \
            --deselect "tests/test_external_contracts_live.py::TestVarlockProxyRulesOutput::test_a_bare_proxy_annotation_makes_the_schema_invalid"

      # A BUILD THAT NEVER LAUNCHES PROVES NOTHING ABOUT LAUNCHING. This is the step that would
      # have caught #458: `harnessed build` exited 0 on docker while `container-run` was creating
      # the agent with `--network=container:<a pod that is never created>`. The build path and the
      # launch path share almost no code past image assembly, so a green build is not evidence
      # about the half users actually run.
      #
      # `livecheck`, NOT `default`: stack names resolve through the user-overlay catalog too, so
      # `default` means one thing on a runner and another on a developer's machine — where it
      # pulled in a private recipe holding a 1Password ref. A test must not be able to reach a
      # secret. `livecheck` is a repo-only name nobody overlays.
      #
      # `harnessed test` is the headless launch plus the stack's declared capability assertions —
      # it stands the instance up, waits for hatago, asserts, and tears down. `--json` so a failure
      # is machine-readable in the log rather than buried in prose.
      - name: Launch a stack and assert its capabilities (podman)
        env:
          HARNESSED_PODMAN: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--keep` so the diagnostics step below has something to inspect. Without it `harnessed
        # test` tears the instance down on its way out, and the collector then finds no container
        # at all -- which is exactly what happened on the first docker failure: the report said
        # "re-run with --keep, then exec ... cat /tmp/hatago.log" and the run had already discarded
        # the only copy. The runner is destroyed at job end, so nothing leaks.
        run: mise exec -- uv run --extra dev harnessed test livecheck claude --json --keep

      # THE LAUNCH FAILURE MESSAGE NAMES A LOG THIS JOB DID NOT COLLECT. `harnessed test` ends with
      # "Inspect the hub log: {rt} exec <instance> cat /tmp/hatago.log" — good advice on a laptop,
      # useless in CI, where the container is gone by the time anyone reads the run. A launch that
      # fails here is then undiagnosable without pushing another commit to add the very step that
      # would have explained the first one.
      #
      # `|| true` throughout and `if: failure()`: this step must never change the job's verdict, and
      # every command in it is expected to fail in some scenario (no container, hub never started,
      # log absent). Its only job is to put the evidence in the run log.
      - name: Collect launch diagnostics
        if: failure()
        env:
          CONTAINER_RUNTIME: podman
        run: |
          rt=podman
          echo "=== containers (all) ==="
          $rt ps -a || true
          for c in $($rt ps -aq --filter "name=harnessed-" 2>/dev/null); do
            echo "=== $rt logs $c ==="
            $rt logs --tail 200 "$c" 2>&1 || true
            echo "=== hatago log inside $c ==="
            $rt exec "$c" cat /tmp/hatago.log 2>&1 || true
            echo "=== identity + home inside $c ==="
            $rt exec "$c" sh -c 'id; ls -ld /home/harnessed /home/harnessed/.claude /home/harnessed/.local 2>&1' 2>&1 || true
          done
          echo "=== volumes ==="
          $rt volume ls || true

      - name: Report what ran
        if: always()
        run: echo "Live layer ran with HARNESSED_PODMAN=1; see the 'live verification' section in the log."

  # ---------------------------------------------------------------------------------------------
  # The DOCKER twin of `live`. Same suite, same gates, other runtime.
  #
  # WHY A SECOND JOB rather than a matrix on `live`: a matrix rewrites the status-check context to
  # `live (podman)` / `live (docker)`, and `live` is about to become a required check. Renaming a
  # required context leaves branch protection waiting forever on one that never reports again —
  # the trap `test.yml` already records for `pytest`, and the reason `pytest-py313` is its own job.
  #
  # WHY IT CAN EXIST AT ALL, since it could not before this PR:
  #   * a GitHub runner has BOTH binaries, and detection prefers podman — so a docker job was
  #     inexpressible until `CONTAINER_RUNTIME` was honoured in `paths.active_runtime`;
  #   * the runner is uid 1001, and until `paths.container_user_args` ran the agent as the invoking
  #     user, docker wrote every file as host uid 1000. That is #457, and it made this job
  #     impossible rather than merely red.
  #
  # No "ensure docker is available" step: docker is preinstalled on ubuntu-latest, and unlike the
  # podman step there is nothing to install. It is still ASSERTED below rather than assumed — this
  # job's entire value is that a real docker did the work, so a silent fallback to no-runtime must
  # fail loudly here.
  live-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Setup uv (+ Python 3.12)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
        with:
          install: true
          version: 2026.8.2

      # Verified, not assumed — the same standard the podman job holds itself to. `docker info`
      # rather than `--version`: a client binary with no reachable daemon passes the version check
      # and fails every test afterwards, which is the least readable way for this job to go red.
      - name: Ensure docker is available and the daemon answers
        run: |
          docker --version
          docker info >/dev/null

      - name: Build the base image the live tests require
        env:
          CONTAINER_RUNTIME: docker
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- uv run --extra dev harnessed build

      # Same reasoning as the podman job: a diagnostic that runs only after a passing suite
      # diagnoses nothing. The uid line is the one that matters here — #457 turned on the runner
      # being 1001, and `--user` is what makes that work rather than a coincidence.
      - name: Runner identity
        env:
          CONTAINER_RUNTIME: docker
        run: |
          echo "uid=$(id -u) gid=$(id -g) user=$(id -un)"
          docker info --format 'rootless={{range .SecurityOptions}}{{.}} {{end}}'
          echo "branch=$(git branch --show-current) UV_PROJECT_ENVIRONMENT=${UV_PROJECT_ENVIRONMENT:-<unset>}"

      # HARNESSED_DOCKER gates the live-docker tests the way HARNESSED_PODMAN gates the podman
      # ones. CONTAINER_RUNTIME is what actually forces the runtime: without it detection picks
      # podman, which is installed here too, and this job would silently retest the podman path
      # while reporting itself as docker coverage.
      - name: Run the live-verification layer against docker
        env:
          CONTAINER_RUNTIME: docker
          HARNESSED_DOCKER: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/run-tests.sh -v

      # Same reasoning as the podman job's launch step: the build path and the launch path share
      # almost no code past image assembly, and every docker defect after the first was in the
      # launch half. This is the step that keeps them fixed.
      - name: Launch a stack and assert its capabilities (docker)
        env:
          CONTAINER_RUNTIME: docker
          HARNESSED_DOCKER: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--keep` so the diagnostics step below has something to inspect. Without it `harnessed
        # test` tears the instance down on its way out, and the collector then finds no container
        # at all -- which is exactly what happened on the first docker failure: the report said
        # "re-run with --keep, then exec ... cat /tmp/hatago.log" and the run had already discarded
        # the only copy. The runner is destroyed at job end, so nothing leaks.
        run: mise exec -- uv run --extra dev harnessed test livecheck claude --json --keep

      # THE LAUNCH FAILURE MESSAGE NAMES A LOG THIS JOB DID NOT COLLECT. `harnessed test` ends with
      # "Inspect the hub log: {rt} exec <instance> cat /tmp/hatago.log" — good advice on a laptop,
      # useless in CI, where the container is gone by the time anyone reads the run. A launch that
      # fails here is then undiagnosable without pushing another commit to add the very step that
      # would have explained the first one.
      #
      # `|| true` throughout and `if: failure()`: this step must never change the job's verdict, and
      # every command in it is expected to fail in some scenario (no container, hub never started,
      # log absent). Its only job is to put the evidence in the run log.
      - name: Collect launch diagnostics
        if: failure()
        env:
          CONTAINER_RUNTIME: docker
        run: |
          rt=docker
          echo "=== containers (all) ==="
          $rt ps -a || true
          for c in $($rt ps -aq --filter "name=harnessed-" 2>/dev/null); do
            echo "=== $rt logs $c ==="
            $rt logs --tail 200 "$c" 2>&1 || true
            echo "=== hatago log inside $c ==="
            $rt exec "$c" cat /tmp/hatago.log 2>&1 || true
            echo "=== identity + home inside $c ==="
            $rt exec "$c" sh -c 'id; ls -ld /home/harnessed /home/harnessed/.claude /home/harnessed/.local 2>&1' 2>&1 || true
          done
          echo "=== volumes ==="
          $rt volume ls || true

      - name: Report what ran
        if: always()
        run: echo "Live layer ran with CONTAINER_RUNTIME=docker HARNESSED_DOCKER=1."
