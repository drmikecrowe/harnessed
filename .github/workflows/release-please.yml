name: release-please

# Keeps one open "Release PR" that bumps the version and writes CHANGELOG.md from the conventional
# commits on main. Merging that PR tags `vX.Y.Z` and creates the GitHub Release. Config lives in
# `release-please-config.json`; the current version in `.release-please-manifest.json`.
#
# GITHUB_TOKEN, not a PAT: GitHub signs API commits made by github-actions[bot], and the main
# ruleset requires signed commits. A PAT's API commits are unsigned (v0.2.0 hit this).
# The cost: a PR opened with GITHUB_TOKEN starts no workflows, so the last step dispatches
# test.yml on the Release PR branch to report the required `pytest` check. workflow_dispatch is
# the one event GITHUB_TOKEN may still trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA for the same reason as test.yml: a tag is mutable.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Branch name goes through env, never interpolated into the script. Guarded on `pr` itself,
      # not `prs_created`: on 49d5fa4 the latter was 'true' with no Release PR and `pr` empty, so
      # fromJSON failed the run.
      - if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run test.yml --ref "$BRANCH"
