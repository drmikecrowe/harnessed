name: release-please

# Keeps one open "Release PR" that bumps the version and writes CHANGELOG.md from the conventional
# commits on main. Merging that PR tags `vX.Y.Z` and creates the GitHub Release. Config lives in
# `release-please-config.json`; the current version in `.release-please-manifest.json`.
#
# GITHUB_TOKEN, not a PAT: GitHub signs API commits made by github-actions[bot], and the main
# ruleset requires signed commits. A PAT's API commits are unsigned (v0.2.0 hit this).
# The cost: a PR opened with GITHUB_TOKEN starts no workflows, so the last step dispatches
# test.yml on the Release PR branch to report the required `pytest` check. workflow_dispatch is
# the one event GITHUB_TOKEN may still trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA for the same reason as test.yml: a tag is mutable.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Attach install.sh to every release, so the README one-liner
      # (releases/latest/download/install.sh) fetches the installer from the newest release.
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" install.sh --clobber

      # Branch name goes through env, never interpolated into the script. Guarded on `pr` itself,
      # not `prs_created`: on 49d5fa4 the latter was 'true' with no Release PR and `pr` empty, so
      # fromJSON failed the run. The `if` alone did not stop it: an expression `fromJSON` in `env:`
      # still failed on f98963a, 3e09c64, 621c282 and 211666e, so the JSON is parsed in the shell.
      - if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r '.headBranchName // empty' <<<"$PR")
          if [ -z "$BRANCH" ]; then
            if [ -n "${PR//[[:space:]]/}" ]; then
              echo "::warning::release-please pr output has no headBranchName; test.yml not dispatched"
            fi
            exit 0
          fi
          gh workflow run test.yml --ref "$BRANCH"
