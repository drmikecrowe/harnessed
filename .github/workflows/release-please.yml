name: release-please

# Keeps one open "Release PR" that bumps the version and writes CHANGELOG.md from the conventional
# commits on main. Merging that PR tags `vX.Y.Z` and creates the GitHub Release. Config lives in
# `release-please-config.json`; the current version in `.release-please-manifest.json`.
#
# RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN triggers no workflows, so
# the `pytest` check the main ruleset requires would never report and the Release PR could never
# merge. The secret is a fine-grained PAT scoped to this repo (contents + pull-requests: write).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA for the same reason as test.yml: a tag is mutable.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
