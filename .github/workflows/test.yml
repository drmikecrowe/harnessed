name: tests

# Runs the hermetic pytest suite. No `paths:` filter on purpose: when this workflow is a
# required status check, a path filter would deadlock PRs that don't touch the filtered paths
# (the check never reports → the PR can never merge). The suite is small and fast, so always run.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Hermetic: no podman on the runner, so the HARNESSED_PODMAN-gated integration tests skip.
      # That is deliberate and it is NOT the whole story — those tests have a home in `live.yml`,
      # which currently runs them only by manual dispatch with podman installed. Push and nightly
      # triggers remain disabled until `harnessed-ng5` is fixed. Before it existed they ran nowhere
      # at all, and this job's skip count was the only trace of it (bd harnessed-3x1).
      # The run now prints a "live verification" section naming what did not execute.
      - name: Run tests
        run: uv run --extra dev pytest

  # The declared range is `requires-python = ">=3.12"`, so 3.12 alone only proves the floor.
  # 3.13 changed pathlib, dict/asyncio and warnings behaviour under us at least once already
  # (bd harnessed-925), and it is what a contributor gets by default if their box has it.
  #
  # A second job rather than a matrix on `pytest`: a matrix renames the check to
  # `pytest (3.12)`, and `pytest` is a required status check on this repo — renaming it
  # silently leaves the branch protection waiting on a context that never reports again.
  pytest-py313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv (+ Python 3.13)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: uv run --extra dev pytest
