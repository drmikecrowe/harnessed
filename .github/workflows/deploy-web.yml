name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # The docs live in the GitHub wiki (a separate repo), not here, so a wiki edit can't trigger this
  # workflow on push. Rebuild daily so wiki changes reach the site within a day; workflow_dispatch
  # for on-demand.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, canceling in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web/scripts/sync-docs.mjs reads ../docs (the wiki) at build time. The wiki is a SEPARATE repo
      # (harnessed.wiki), gitignored here and not checked out by the step above — without this, the
      # sync no-ops in CI and the site's /docs/* pages are never built (they 404). Clone it to
      # <root>/docs so ../docs resolves from web/.
      - name: Checkout wiki (docs source)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: docs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
