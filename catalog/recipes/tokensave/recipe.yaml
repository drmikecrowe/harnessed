# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: tokensave — a pre-indexed semantic code knowledge graph MCP server (80+ tools, 50+ languages).
#
# tokensave is a stdio MCP server that indexes the project into a libSQL graph under .tokensave/.
# hatago (the in-container MCP hub) spawns it as a stdio child (stdio→HTTP), so the child inherits
# the project as cwd and indexes it. `transport: stdio` is the default and is omitted here. No skill
# is shipped — upstream offers none; the 80+ tools are discovered via the native tool surface.
#
# CONTINGENT on the hatago consolidation (catalog/todos/2026-06-29-hatago-consolidation.md): until
# hatago lands in the harness container this recipe is correct in shape but cannot index (no project
# mount). The optional git-hook freshness enhancement (below) additionally needs the startup-hooks
# feature — a separate, lighter dependency — and is therefore deferred (commented out).
name: tokensave
description: tokensave — pre-indexed semantic code knowledge graph (80+ tools, 50+ languages, 100% local).

# `tools:` owns the binary in BOTH modes, so this recipe has no Dockerfile and no `install:` at all.
#
# It used to be ROOT-ONLY — the download ran fine unprivileged but its DESTINATION needed root
# (`install -m 0755 … /usr/local/bin/tokensave` under `USER root`), which forced the whole step
# into a Dockerfile and made a host launch skip it with an audible warning. mise removes the reason:
# it installs into the stack's own tool tree, already on PATH in both modes, so there is nothing
# left that needs privilege and nothing left to skip.
#
# NC-7 — the supply-chain posture must not regress — is met by `mise.lock` beside this file, which
# records the SAME per-arch sha256 the deleted Dockerfile verified by hand:
#   x86_64  d35519fe…b40460      aarch64  69c88d06…ad334
# mise refuses the install on a mismatch (measured: exit 1, "Checksum mismatch"). That checksum is
# the whole of the guarantee claimed here.
#
# The `github:` backend ALSO prints attestation and SLSA-provenance steps for this artifact, but
# that is deliberately NOT claimed as a property: it runs only when upstream publishes the relevant
# provenance, the lockfile records none of it, and no test here asserts it. Observing a log line
# once is not evidence that verification is enforced when the provenance is absent.
tools:
  - github:aovestdipaperino/tokensave@7.8.1

setup:
  summary: >-
    Run `tokensave init` once per project to create the `.tokensave/` knowledge graph database
    (the server only syncs already-initialised projects), then restart your agent.
  reference: https://github.com/aovestdipaperino/tokensave

# What the capability test must find after building: the tokensave MCP server connected through hatago.
expect:
  mcp: [tokensave]

# --- MCP layer ---
# hatago spawns `tokensave serve` in-container; it sees the bind-mounted project and writes .tokensave/
# into it. A network-native server would use `url`/`service` + `transport: http` instead.
mcp:
  servers:
    - name: tokensave
      command: tokensave
      args: [serve]
      # transport: stdio (default). hatago spawns it in-container → it sees the project.

# --- Freshness (OPTIONAL, deferred) ---
# `tokensave serve` already self-freshens (on-demand staleness check + catch-up sync on connect), so
# no hook is required for the MCP tools to work. The git-hook install below is a pure enhancement
# that additionally needs the startup-hooks feature (not yet landed); left commented out until then.
# hooks:
#   new_session:
#     script: hooks/new-session.sh
#     when_missing: .tokensave
