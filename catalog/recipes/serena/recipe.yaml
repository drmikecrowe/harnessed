# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: serena — LSP-backed semantic code intelligence over the project (oraios/serena).
#
# Serena runs as an MCP server whose DEFAULT transport is stdio (`start-mcp-server`), so it is a
# plain hatago stdio child: hatago spawns `serena start-mcp-server` in-container, wraps its stdio
# into the single Streamable-HTTP endpoint the harness talks to, and the child sees the
# bind-mounted project (`.serena/` lands in the project dir on the host). No `transport:` field is
# needed — stdio is the schema default. No `url:`/`service:` (it is not a network-native server),
# no port, no `hooks:` (a stdio child has no daemon lifecycle — hatago owns the spawn).
#
# `--context ide` is serena's harness-agnostic generic context for terminal clients (it disables
# serena's basic file/search tools to avoid overlap with the harness's own, and is single-project:
# with a project given at startup, `activate_project` is dropped). `--project-from-cwd` resolves the
# project by walking up from the child's cwd to the nearest `.serena/project.yml` or git root;
# emit.py pins that cwd to the mirrored container project path (bd main-u5d), so the child lands in
# the project root. Activating a directory that has no `.serena/project.yml` auto-generates one
# (serena_config.py `add_project_from_path` → `ProjectConfig.load(autogenerate=True)`), so project
# *creation* needs no manual step — only indexing does (see `setup:` below). The CLI is installed by
# `install.sh` (both modes); no skill is shipped (upstream offers none).
name: serena
description: Serena — LSP-backed semantic code intelligence (symbol retrieval, editing, refactoring, references) over the project via a stdio MCP server.

# The install half — the CLI plus `serena init -b LSP`, the global language-server backend config —
# as ONE bash file run by BOTH executors: `RUN bash install.sh` in the derived image, and by the
# launcher after the host home is materialized on `launch --host`. It replaces the recipe Dockerfile
# (container-only) AND setup.sh's old host-only install branch, which between them meant a host
# launch installed serena but never configured its backend.
#
# No `cache:` — `install.cache` keys a pinned CONTENT clone; uv caches wheels itself. No `system:` —
# `uv tool install` needs no root (host mode redirects it into the stack tools tree via UV_TOOL_DIR).
#
# FOOTPRINT (bd harnessed-8px.6): `serena init` writes `~/.serena/serena_config.yml`, and setup.sh
# writes a project-local `.serena/`. Both are OUTSIDE HARNESSED_CONFIG_DIR; README.md documents the
# removal commands.
# `tools:` owns the CLI (bd harnessed-1t4.3); install.sh keeps `serena init -b LSP`, the
# CONFIGURATION half mise cannot express. mise's pipx backend resolves through uv.
tools:
  - pipx:serena-agent@1.5.3

install:
  script: install.sh

# What `install.sh` CANNOT do — and never could, it is per-project state — is the project identity
# and the symbol index. That is what remains in setup.sh, whose phase has HARNESSED_PROJECT_DIR.
setup:
  summary: >-
    First launch runs `setup.sh` automatically: it creates the serena project with a repo-derived
    name (the CLI itself and the LSP backend config are handled earlier, by `install.sh`, in both
    modes), pre-caching language-server symbols into `.serena/` so the first symbol tool call does
    not pay the full scan. Note the language server for each language is downloaded on first use, so the
    first launch needs egress — inside a container the setup runs BEFORE the firewall closes, but a
    later manual `serena project index` would need `--no-firewall`.
  reference: https://oraios.github.io/serena/02-usage/040_workflow.html
  # Still worth showing while the project carries no serena state at all.
  condition: test ! -d .serena
  # The project NAME serena would otherwise take from the DIRECTORY — which in a bare+worktree
  # checkout is the worktree folder ("main"), never the repo. `{repo}` and NOT `{gcd_db}`: serena's
  # registry is keyed by PATH, and its cache/memories are per-checkout by design, so unlike beads a
  # worktree-STABLE identity is explicitly not wanted. See setup.sh.
  config:
    - key: name
      derive: "{repo}"
  # PROJECT-shaped work only. The install half moved to `install.sh` above; what is left here needs
  # HARNESSED_PROJECT_DIR + HARNESSED_CFG_NAME, which the install env deliberately does not carry.
  script: setup.sh

# What the capability test probes after a successful build: the serena server connected through
# the hatago hub. (The capability test only confirms the connection — verify behavior manually.)
expect:
  mcp: [serena]

# --- MCP layer ---
mcp:
  servers:
    - name: serena
      command: serena
      args: [start-mcp-server, --context, ide, --project-from-cwd]
      # transport: stdio (schema default). hatago spawns this in-container → it sees the project.

# No `provision:` — `install.script` above subsumes it. `provision:` could only INSTALL, and only
# host-side, so the matching `serena init -b LSP` had to live in the Dockerfile, which never runs on
# a host launch; install.sh does both, in both modes, from one file.
