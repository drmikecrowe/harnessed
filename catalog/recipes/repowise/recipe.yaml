# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: repowise — code health / change-risk / defect-prediction layer over the project
# (repowise-dev/repowise, PyPI `repowise`, AGPL-3.0).
#
# repowise's MCP server default transport is stdio (`repowise mcp --transport stdio`), so it is a
# plain hatago stdio child: hatago spawns it in-container and wraps stdio into the single
# Streamable-HTTP endpoint the harness talks to.
#
# KNOWN GAP (shared with the serena recipe, see PLAN.md): hatago spawns stdio children with
# cwd = /home/harnessed, NOT the project root — the project is bind-mounted at its mirrored host
# path (paths.container_project_path()), not at cwd. repowise resolves its target from cwd when no
# path is given, so as shipped this recipe will index the wrong directory until that core-infra gap
# is closed. Recipe is correct in shape; do not ship until resolved (see PLAN.md).
#
# Do NOT run repowise's own `repowise init` (auto-registers MCP servers, writes hooks into
# ~/.claude/settings.json, generates .mcp.json/AGENTS.md/CLAUDE.md) — harnessed owns all of that.
# The CLI is baked by the Dockerfile; no skill is shipped (upstream's slash commands ship only via
# its own Claude plugin marketplace install path, not a portable skill).
name: repowise
description: repowise — code health, change-risk, and dependency-graph intelligence over the project via a stdio MCP server.

# What the capability test probes after a successful build: the repowise server connected through
# the hatago hub. (The capability test only confirms the connection — verify behavior manually;
# the index itself is built lazily on first use, not at image-build time.)
expect:
  mcp: [repowise]

# --- MCP layer ---
mcp:
  servers:
    - name: repowise
      command: repowise
      args: [mcp, --transport, stdio]
      # transport: stdio (schema default). hatago spawns this in-container → it sees the project.
