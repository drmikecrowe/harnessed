# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: repowise — code health / change-risk / defect-prediction layer over the project
# (repowise-dev/repowise, PyPI `repowise`, AGPL-3.0).
#
# repowise's MCP server default transport is stdio (`repowise mcp --transport stdio`), so it is a
# plain hatago stdio child: hatago spawns it in-container and wraps stdio into the single
# Streamable-HTTP endpoint the harness talks to.
#
# PROJECT RESOLUTION: `repowise mcp` with no PATH walks up from its cwd to the nearest *initialised*
# `.repowise` repository. emit.py pins each stdio child's cwd to the mirrored container project path
# (bd main-u5d), so the child starts in the project root and resolves it — the same mechanism
# serena's `--project-from-cwd` relies on.
#
# INDEX FIRST: the server serves an existing index, it does not build one. Per upstream's quick start
# the project must be indexed once (`repowise init --index-only -y`, no LLM key needed) before the
# MCP tools have anything to answer from — hence the `setup:` note below.
#
# EDITOR-FILE POLLUTION (verified against repowise 0.31.0 source, cli/editor_setup.py +
# cli/editor_integrations/{claude,vscode}.py): `repowise init` unconditionally writes its own
# `.mcp.json` (repo root), `.repowise/mcp.json`, and `.vscode/mcp.json`/`extensions.json` — NONE of
# `REPOWISE_SKIP_EDITOR_SETUP=1`, `--no-claude-md`, `--no-agents`, `--no-codex`, or
# `--no-distill-hook` gate those three writes (no upstream flag does; `REPOWISE_SKIP_EDITOR_SETUP`
# only skips *global* client registration in `~/.claude/settings.json`). harnessed owns MCP
# registration via hatago, so the setup command's `rm -f` below is required, not optional — without
# it you end up with the repowise server registered twice: once correctly via hatago, and once more
# directly through the stray `.mcp.json`/`.vscode/mcp.json` it wrote, the latter using whatever env
# the editor/host process happened to have (a common source of one server working and its duplicate
# silently degrading to mock embeddings, since they run with different environments).
# The CLI is installed by `install.sh` (both modes); no skill is shipped (upstream's slash commands ship only via
# its own Claude plugin marketplace install path, not a portable skill).
name: repowise
description: repowise — code health, change-risk, and dependency-graph intelligence over the project via a stdio MCP server.

setup:
  summary: >-
    Index the project once, inside the agent container:
    `REPOWISE_SKIP_EDITOR_SETUP=1 repowise init --index-only -y --no-claude-md --no-agents --no-codex
    --no-distill-hook && rm -f .repowise/mcp.json .mcp.json .vscode/mcp.json .vscode/extensions.json`
    — writes `.repowise/wiki.db` (dependency graph + git history + code health; no LLM key required).
    The `rm -f` is required: repowise's `--no-*` flags do not stop it writing its own MCP/editor
    config files (no upstream flag does) — harnessed's hatago registration is the only one you want.
    Want real embeddings / LLM-generated summaries instead of the no-key index? See README.md for the
    full-LLM opt-in path. The MCP server only serves an already-indexed repo. Restart your agent after.
  reference: https://github.com/repowise-dev/repowise#quick-start-under-5-minutes-no-api-key
  # Still needed while the project carries no repowise index.
  condition: test ! -d .repowise

# The CLI, as ONE bash file run by BOTH executors: `RUN bash install.sh` in the derived image, and
# by the launcher after the host home is materialized on `launch --host`. Replaces both the recipe
# Dockerfile (container-only) and the former `provision:` block (host-only) — one file, both modes.
#
# No `cache:` — `install.cache` keys a pinned CONTENT clone; uv caches wheels itself. No `system:` —
# `uv tool install` needs no root (host mode redirects it into the stack tools tree via UV_TOOL_DIR).
install:
  script: install.sh

# What the capability test probes after a successful build: the repowise server connected through
# the hatago hub. (The capability test only confirms the connection — the index is per-project state
# created by the `setup:` step above, never at image-build time.)
expect:
  mcp: [repowise]

# --- MCP layer ---
mcp:
  servers:
    - name: repowise
      command: repowise
      args: [mcp, --transport, stdio]

