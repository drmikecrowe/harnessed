# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: repowise — code health / change-risk / defect-prediction layer over the project
# (repowise-dev/repowise, PyPI `repowise`, AGPL-3.0).
#
# repowise's MCP server default transport is stdio (`repowise mcp --transport stdio`), so it is a
# plain hatago stdio child: hatago spawns it in-container and wraps stdio into the single
# Streamable-HTTP endpoint the harness talks to.
#
# PROJECT RESOLUTION: `repowise mcp` with no PATH walks up from its cwd to the nearest *initialised*
# `.repowise` repository. emit.py pins each stdio child's cwd to the mirrored container project path
# (bd main-u5d), so the child starts in the project root and resolves it — the same mechanism
# serena's `--project-from-cwd` relies on.
#
# INDEX FIRST: the server serves an existing index, it does not build one. Per upstream's quick start
# the project must be indexed once (`repowise init --index-only -y`, no LLM key needed) before the
# MCP tools have anything to answer from — hence the `setup:` note below. Do NOT let repowise wire up
# the editor while doing it: `repowise init` otherwise registers MCP servers, installs a Claude Code
# hook in ~/.claude/settings.json, and generates .mcp.json/AGENTS.md/CLAUDE.md — harnessed owns all of
# that, so the setup command sets REPOWISE_SKIP_EDITOR_SETUP=1 and passes the --no-* flags.
# The CLI is baked by the Dockerfile; no skill is shipped (upstream's slash commands ship only via
# its own Claude plugin marketplace install path, not a portable skill).
name: repowise
description: repowise — code health, change-risk, and dependency-graph intelligence over the project via a stdio MCP server.

setup:
  summary: >-
    Index the project once, inside the agent container:
    `REPOWISE_SKIP_EDITOR_SETUP=1 repowise init --index-only -y --no-claude-md --no-agents --no-codex
    --no-distill-hook` — it writes `.repowise/wiki.db` (dependency graph + git history + code health;
    no LLM key required). The MCP server only serves an already-indexed repo. Restart your agent after.
  reference: https://github.com/repowise-dev/repowise#quick-start-under-5-minutes-no-api-key
  # Still needed while the project carries no repowise index.
  condition: test ! -d .repowise

# What the capability test probes after a successful build: the repowise server connected through
# the hatago hub. (The capability test only confirms the connection — the index is per-project state
# created by the `setup:` step above, never at image-build time.)
expect:
  mcp: [repowise]

# --- MCP layer ---
mcp:
  servers:
    - name: repowise
      command: repowise
      args: [mcp, --transport, stdio]
      # transport: stdio (schema default). hatago spawns this in-container with cwd = the project, so
      # `repowise mcp` finds the project's `.repowise/` by walking up from there.
