# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: agent-carnet — bake the agent-carnet CLI (pure-JS Node) and install its upstream-bundled
# Claude skill into ~/.claude/skills/agent-carnet. No MCP, no service: agent-carnet is a CLI, not a
# server. The .carnet/ notebook is a runtime, per-project operation the build-time Dockerfile can't
# reach, so it is NOT auto-run (recipes hint setup, they don't auto-init every agent — see
# docs/guides/recipe-authoring.md) — surfaced instead via the harness-agnostic `setup:` note below.
#
# The skill is installed VERBATIM from the pinned agent-carnet@<VERSION> npm tarball by `install.sh`
# (skills/agent-carnet/: SKILL.md + references/{cookbook,frontmatter}.md ship inside the package) —
# the recipe authors NO skill itself. One immutable npm artifact is both the CLI pin and the skill pin.
name: agent-carnet
description: agent-carnet — shared, auto-expiring file-based markdown notebook (.carnet/) for AI agents.

# beads (`bd remember` / `bd prime`) is also a persistent cross-session memory store. Combining
# both in one stack gives the agent two competing "sole memory store" instructions (see the
# `rules:` entry below) and duplicate/contradictory workflow guidance.
conflicts: [beads]

# PARTIAL migration (bd harnessed-8px.4). Only the CONTENT half moves here: install.sh fetches the
# pinned npm tarball and copies its bundled skill into $HARNESSED_CONFIG_DIR/skills/agent-carnet, in
# BOTH modes. The CLI half (`pnpm add -g`) stays in the Dockerfile — see the WHY there; it is not a
# root `system:` step, but it IS container-only, so a host launch gets the skill without the binary
# until `provision:` (bd harnessed-zi6.1) covers it. That gap is declared in `system:` below so the
# launcher ANNOUNCES it: a comment here is invisible at runtime, and a host user silently missing
# half a recipe is the exact failure bd harnessed-8px.1 is about.
#
# `cache:` MUST equal AGENT_CARNET_VERSION in install.sh (and the Dockerfile ARG). It keys the host
# content cache ($XDG_CACHE_HOME/harnessed/install/agent-carnet/0.1.5) so the per-launch re-run —
# mandatory, because the host home is rebuilt from scratch every launch — downloads once.
install:
  script: install.sh
  cache: "0.1.5"
  system: >-
    the `agent-carnet` CLI is installed with `pnpm add -g`, which on a host launch would write into
    your global pnpm store — outside every harnessed-owned directory. The bundled SKILL is installed
    in both modes; only the binary is container-only, so `agent-carnet` will not be on PATH.

# What the capability test must find in the running container after a successful build: the skill
# install.sh copies verbatim from the pinned tarball into ~/.claude/skills/agent-carnet. The
# assembler cannot see what an install script installs, so we declare it here.
expect:
  skills: [agent-carnet]

# Instructs the agent to treat carnet as the sole cross-session memory store instead of the
# harness's built-in auto-memory system — otherwise both systems accumulate overlapping notes.
rules:
  - path: rules/agent-carnet

setup:
  summary: >-
    Run `agent-carnet init` once per project to create `.carnet/` (git-free, no .gitignore entry,
    no repo discovery), then restart your agent.
  reference: https://github.com/yamadashy/agent-carnet
