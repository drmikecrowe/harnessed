# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: agent-carnet — bake the agent-carnet CLI (pure-JS Node) and install its upstream-bundled
# Claude skill into ~/.claude/skills/agent-carnet. No MCP, no service: agent-carnet is a CLI, not a
# server. The .carnet/ notebook is a runtime, per-project operation the build-time Dockerfile can't
# reach, so it is NOT auto-run (recipes hint setup, they don't auto-init every agent — see
# docs/guides/recipe-authoring.md) — surfaced instead via the harness-agnostic `setup:` note below.
#
# The skill is installed VERBATIM from the pinned agent-carnet@<VERSION> npm tarball by the Dockerfile
# (skills/agent-carnet/: SKILL.md + references/{cookbook,frontmatter}.md ship inside the package) —
# the recipe authors NO skill itself. One immutable npm artifact is both the CLI pin and the skill pin.
name: agent-carnet
description: agent-carnet — shared, auto-expiring file-based markdown notebook (.carnet/) for AI agents.

# beads (`bd remember` / `bd prime`) is also a persistent cross-session memory store. Combining
# both in one stack gives the agent two competing "sole memory store" instructions (see the
# `rules:` entry below) and duplicate/contradictory workflow guidance.
conflicts: [beads]

# What the capability test must find in the running container after a successful build: the skill the
# Dockerfile copies verbatim from the pinned tarball into ~/.claude/skills/agent-carnet. The assembler
# cannot see what a Dockerfile RUN step installs, so we declare it here.
expect:
  skills: [agent-carnet]

# Instructs the agent to treat carnet as the sole cross-session memory store instead of the
# harness's built-in auto-memory system — otherwise both systems accumulate overlapping notes.
rules:
  - path: rules/agent-carnet

setup:
  summary: >-
    Run `agent-carnet init` once per project to create `.carnet/` (git-free, no .gitignore entry,
    no repo discovery), then restart your agent.
  reference: https://github.com/yamadashy/agent-carnet
