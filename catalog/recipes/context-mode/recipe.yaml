# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: context-mode — per-session token discipline (mksglu/context-mode).
#
# context-mode sandboxes large tool output ("think in code": a command runs in a sandbox and only
# the DERIVED answer enters the conversation, not the raw dump), routes raw Bash/Read/Grep/WebFetch
# through its own `ctx_*` tools, and carries session state across compaction in a local SQLite DB.
#
# Two halves, and BOTH are required — the MCP server alone does nothing:
#   - the MCP server (`ctx_execute`, `ctx_batch_execute`, `ctx_fetch_and_index`, …) is what the
#     agent calls instead of dumping output into context;
#   - the HOOKS are what make it actually fire. PreToolUse injects the routing nudge (use `ctx_*`,
#     not raw Read/Bash); SessionStart re-injects session context. Upstream marks exactly these two
#     REQUIRED (build/adapters/claude-code/hooks.js: REQUIRED_HOOKS). PostToolUse and PreCompact are
#     upstream-OPTIONAL but are what give session continuity across a compaction, so both are wired.
#
# The prior in-repo version of this recipe was a persist tracer-bullet: a hand-written skill that
# appended notes to ~/.context-mode. It shared a name with the real tool and nothing else — no MCP
# server, no hooks, no sandbox. This is the real thing.
name: context-mode
description: >
  Per-session token discipline — sandboxes tool output so only the derived answer enters context,
  routes raw commands through ctx_* tools, and survives compaction via a local SQLite session store.
# setup: none needed — CLI, MCP server, and hooks are all wired by this recipe.

# --- Tool layer ---
# Installed via mise's `npm:` backend (pinned) → a `context-mode` shim lands on PATH. Both the MCP
# server and every hook command below invoke that same one binary.
#
# THIS is the only place the version is written (AC-1). The pin below installs the CLI/MCP binary in
# BOTH modes — the host `pnpm add -g` branch this comment used to describe is gone, not a second
# channel. install.sh installs the omp extension from the same upstream package, and asks
# `mise current npm:context-mode` for the version rather than restating it, so there is nothing here
# to keep in lockstep and nothing that can drift.
tools:
  - npm:context-mode@1.0.169

# --- MCP layer ---
# stdio (the schema default): hatago spawns `context-mode` as a child and wraps stdio→HTTP. Bare
# `context-mode` with no args IS the MCP server — that is upstream's own `.mcp.json` entry.
mcp:
  servers:
    - name: context-mode
      command: context-mode
      transport: stdio

# --- Rule layer ---
# The MCP tools above are reachable in EVERY harness with no hook and no plugin, but nothing tells
# the agent when to prefer them: the hooks below are `skip_harnesses: [omp]` and the replacement omp
# extension is container-only, so an omp launch (and any host launch) gets the tools with zero
# steering. A rule ships to every harness through the profile, so it covers the gap the hook layer
# structurally cannot. Content is deliberately about WHEN to route and how `queries` breadth decides
# whether a call saves or spends — a reducer queried too broadly re-emits the dump it exists to avoid.
#
# Still true against bridge 0.4.0, but for a NARROWER reason than the note below states (that note
# predates 0.4.0 and is now half stale — see the Hook layer). 0.4.0 injects additionalContext from
# any event plus SessionStart/UserPromptSubmit stdout, so the SessionStart half WOULD now bridge.
# `PreToolUse` additionalContext is one of the two paths its README documents as deliberately NOT
# bridged (omp's tool_call result has no context field and there is no current-turn injection API),
# and the routing nudge is exactly a PreToolUse additionalContext hook. So the steering gap this rule
# fills is real regardless of bridge version, and closing it needs an omp API that does not exist.
rules:
  - path: rules/ctx-routing

# --- Install layer ---
# What used to be this recipe's whole Dockerfile: the omp plugin install, as one bash file run by
# BOTH executors (bd harnessed-8px.5). `HARNESS` is in the install env in both modes, so the
# `${HARNESS} = omp` branch that lived in the `RUN` now lives in the script and the recipe stays
# harness-independent.
#
# No `cache:` — `omp plugin install` fetches and installs in one step with nowhere to point a
# populate-if-empty content cache, and the whole step runs container-side only (see below), where
# the cache is /tmp scratch anyway.
#
# No `system:` either: nothing here needs root. The step IS skipped on a host launch, but for a
# different reason — it would write into the user's own ~/.omp/plugins — so the warning is emitted
# by the script itself, which can also say the true thing (it only applies to HARNESS=omp, whereas a
# `system:` string would print for every harness including the ones that skip nothing).
install:
  script: install.sh

# --- Hook layer (GAP 2) ---
# The `context-mode hook <platform> <event>` CLI dispatcher is upstream's current wiring form (the
# older `node .../hooks/<event>.mjs` path form is legacy). Platform is `claude-code` because the
# Claude profile is canonical in harnessed — the other harnesses adapt out of the same .claude/
# profile (see emit._recipe_hooks_settings).
#
# NOTE (2026-08-16, verified against bridge 0.4.0's source AND the live upstream README at
# github.com/drmikecrowe/omp-claude-hooks-bridge — the copy in node_modules can lag): the
# additionalContext claim just below was true of 0.3.0 and is now only HALF true. 0.4.0 injects
# additionalContext from any event plus SessionStart/UserPromptSubmit stdout, so the SessionStart
# half DOES bridge today — though it is QUEUED for the next user prompt (omp session_start handlers
# cannot return context), so it never steers the turn in progress. `PreToolUse` additionalContext is
# one of the two paths the README documents as deliberately NOT bridged (omp's tool_call result has
# no context field, and no current-turn injection API exists), so the routing-nudge half still
# reaches nothing. The double-fire argument for skipping is unaffected either way.
# EXCEPT omp (skip_harnesses below). omp's bridge (omp-claude-hooks-bridge) does replay these, but
# it is a pure decision+side-effect bridge: it drops hookSpecificOutput.additionalContext, so the
# PreToolUse routing nudge and the SessionStart context re-injection — the two halves upstream marks
# REQUIRED — reach nothing, and it maps no omp event to PreCompact at all. omp instead gets
# upstream's own omp extension, installed by this recipe's `install.sh`: it covers all four events
# natively (and hard-blocks curl/wget in bash rather than merely nudging). Leaving these hooks on
# for omp would double-write the session DB and spawn a node CLI per tool call for discarded output.
# CAVEAT (host): that extension install is container-only — see install.sh — so `launch --host`
# with HARNESS=omp has neither the bridged hooks (skipped here) nor the native extension.
#
# Matchers are taken from upstream's own matcher lists, minus the plugin-marketplace tool names
# (`mcp__plugin_context-mode_context-mode__ctx_*`): those only exist on a plugin install, and here
# context-mode is a standalone MCP server behind hatago, so its tools carry hatago's names instead.
# The trailing `mcp__` catch-all subsumes them regardless — and per upstream's own note, the hook
# body (`isExternalMcpTool()` in hooks/core/routing.mjs) filters context-mode's own tools out, so
# dropping the plugin-specific entries preserves the semantics exactly.
hooks:
  # Per-ENTRY skips rather than the recipe-wide `skip_harnesses: [omp]` this replaces. That key is
  # all-or-nothing, so suppressing the one event omp cannot deliver cost every other event too, and a
  # recipe could not say "native here, bridged there" per event. Each skip below now carries its own
  # reason, because they are NOT the same reason — one is structural, three are double-fire.
  PreToolUse:
    # REQUIRED upstream. Injects the routing instruction steering the model to `ctx_*` over raw tools.
    # STRUCTURAL on omp, and the only skip here that no bridge version can lift: omp's `tool_call`
    # result has no context field and there is no current-turn injection API, so
    # omp-claude-hooks-bridge documents PreToolUse additionalContext as deliberately not bridged.
    # Replaying it would spawn a node CLI per tool call to produce output nothing can deliver.
    - command: context-mode hook claude-code pretooluse
      matcher: Bash|WebFetch|Read|Grep|Agent|mcp__
      skip_harnesses: [omp]
  SessionStart:
    # REQUIRED upstream. Injects active session context + routing enforcement at session open.
    # DOUBLE-FIRE on omp, not structural: bridge 0.4.0 DOES inject SessionStart additionalContext and
    # stdout (queued to the next prompt, since omp session_start handlers cannot return context). The
    # native extension handles session_start directly and without that queuing, so it is the better
    # of the two — but only one may run.
    - command: context-mode hook claude-code sessionstart
      skip_harnesses: [omp]
  PostToolUse:
    # Optional upstream. Captures edits / git ops / tasks / errors into SQLite for continuity.
    # DOUBLE-FIRE on omp: the bridge maps this to tool_result and it works, but the native extension
    # writes the same rows. Two writers on one SQLite session store is the exact duplication the skip
    # mechanism exists to prevent.
    - command: context-mode hook claude-code posttooluse
      matcher: Bash|Read|Write|Edit|NotebookEdit|Glob|Grep|TodoWrite|TaskCreate|TaskUpdate|EnterPlanMode|ExitPlanMode|Skill|Agent|AskUserQuestion|EnterWorktree|mcp__
      skip_harnesses: [omp]
  PreCompact:
    # Optional upstream. Snapshots session state before compaction so the model can resume via BM25.
    # INERT on omp: the bridge maps no omp event to PreCompact, so this would never fire there. Skipped
    # to say so explicitly rather than shipping a hook that silently cannot run; the native extension
    # covers it via session_before_compact.
    - command: context-mode hook claude-code precompact
      skip_harnesses: [omp]

# --- Persist layer ---
# context-mode's sessions/content store — the SQLite DB the PostToolUse/PreCompact hooks (and, on
# omp, the native plugin's tool_result/session_before_compact handlers) write, and the
# post-compaction resume reads back. Without persist it dies with the container, and `--fresh` would
# silently cost every prior session.
#
# `env:` below pins CONTEXT_MODE_DIR at this entry so BOTH paths land here: it is already the
# default for the hook/CLI path, but the omp plugin would otherwise root at ~/.omp/context-mode/
# (its OMPAdapter), which nothing mounts.
#
# scope: workspace — keyed by the exact launch path, so one project's session log never surfaces in
# another's. location: host — harnessed owns the dir under $XDG_DATA_HOME/harnessed/persist/ and
# mounts it rw at ~/.context-mode in the pod.
persist:
  - name: .context-mode
    scope: workspace
    location: host

# --- Env layer ---
# The store root, read at RUN time by the CLI, every hook invocation, and the omp plugin alike — so
# it must be live in the AGENT's environment, which is why it is `env:` and not a setup script (an
# `export` dies with the script that ran it).
#
# `{persist:.context-mode}` — NOT a literal path. The dir this entry resolves to differs per mode:
# in the pod it is the bind-mount target ~/.context-mode; on `launch --host` there is no mount and
# the bytes live at their real $XDG_DATA_HOME/harnessed/persist/... location. One declaration, the
# correct absolute path in both.
env:
  CONTEXT_MODE_DIR: "{persist:.context-mode}"

# Capability test: the context-mode MCP server connected through the hatago hub. (The hooks are
# merged into settings.json by the assembler; the oracle only probes the MCP connection.)
expect:
  mcp: [context-mode]
