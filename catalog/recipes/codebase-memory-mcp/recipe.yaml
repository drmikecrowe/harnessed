# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: codebase-memory-mcp (cbm) — structural code intelligence via a stdio MCP server.
#
# cbm builds a tree-sitter knowledge graph across 158 languages (14 tools: index_repository,
# search_graph, trace_path, query_graph Cypher, get_architecture, detect_changes, …) into an
# embedded SQLite DB — a single static C binary, zero runtime deps. Transport: stdio.
#
# Like `time`, this is a stdio MCP server: hatago spawns it as a child (stdio→HTTP) and the harness
# only ever talks to hatago's single Streamable-HTTP endpoint. Unlike `time` (uvx) the server is a
# baked-in binary, so `tools:` installs it (the assembler cannot see what a tool install puts on
# PATH, hence the `expect:` below). The recipe ships no skill — upstream offers none.
#
# Contingent on the hatago consolidation (catalog/todos/2026-06-29-hatago-consolidation.md): until
# hatago lands in the harness container the stdio child has no project to index, so the recipe is
# correct in shape but cannot run end-to-end. See PLAN.md.
name: codebase-memory-mcp
description: 158-language codebase knowledge graph (tree-sitter) via a stdio MCP server.
# setup: none needed — self-contained binary; MCP fully wired by recipe

# The binary, via `tools:` in BOTH modes. install.sh is gone: every line of it was a hand-rolled
# `mise use -g` / `mise install`, which is precisely what `tools:` does — and it did so by branching
# on HARNESSED_MODE, because a host `mise use -g` would have edited the USER's own
# ~/.config/mise/config.toml and put cbm in every shell they open.
#
# harnessed removes that reason: the host tools path redirects MISE_CONFIG_DIR into the stack's own
# tree (hostrun._apply_host_mise_env), so `mise use -g` there touches nothing of the user's. The
# host branch's manual `ln -sf … "$UV_TOOL_BIN_DIR"` goes too — launcher puts the stack's mise SHIM
# dir on the agent's PATH, which is how ccstatusline has always resolved. Verified by reading both,
# not assumed: this recipe's own comments were the only place that claimed otherwise.
#
# `mise.lock` beside this file pins the release asset's sha256 per platform. The shell version
# verified NO checksum at all, so this is a strict improvement rather than parity — mise refuses
# the install on a mismatch (measured: exit 1, "Checksum mismatch").
#
# NC-7 has no old literal to compare against here (there was none), so the lockfile was checked
# against the RELEASE ASSETS instead — downloaded and hashed independently of mise:
#   linux-amd64  e2832a8d…6fc679      linux-arm64  68a345d9…93a680
# The lockfile also records `provenance = "github-attestations"`. That is mise's field, not a
# property claimed here: nothing in this repo asserts it and it is not part of the guarantee.
tools:
  - github:DeusData/codebase-memory-mcp@0.9.0

# What the capability test must find after a successful build: the cbm MCP server connected through
# the hatago hub. (The binary itself comes from `tools:` above; `expect:` is the only way the
# capability test learns about it.)
expect:
  mcp: [codebase-memory-mcp]

# --- MCP layer ---
# `transport: stdio` (default): hatago runs `codebase-memory-mcp` as a child, wrapping stdio→HTTP.
# The command resolves through mise shims in BOTH modes — the image's global mise config in a
# container, and the stack's own shims dir on a host launch, which `_launch_host` puts on PATH
# (launcher.py, `_host_tool_shims_dir`). Never /usr/local/bin. No args: upstream's own stdio config
# is `"args": []`, and cbm derives the project name from the child's cwd, so `--project-root` is
# not needed here.
#
# It does NOT index that project on its own: cbm ships `auto_index = false` (verified via
# `codebase-memory-mcp config list` at 0.9.0). Turning it on is a `config set`, which persists to
# `~/.cache/codebase-memory-mcp/` — the user's REAL home, shared by every stack. Unlike mise, whose
# config and data dirs the host launch redirects into the stack's own tree, cbm's cache dir is not
# redirected, so that write would escape the stack. The SessionStart hook below indexes the current
# checkout instead, which keeps the write stack-scoped.
mcp:
  servers:
    - name: codebase-memory-mcp
      command: codebase-memory-mcp
      transport: stdio

# --- hooks ---
# The half of upstream's wiring the binary-extract step deliberately skips. This recipe installs the
# BINARY and nothing else — never cbm's own installer, which rewrites .mcp.json/skills/AGENTS.md for
# 11 agents. But that installer ALSO configures three Claude Code hooks — and without them the MCP
# server is merely *present*, not *reached*: nothing steers the agent to it, and Grep/Glob stay
# graph-blind. Declared here so the assembler renders them into settings.json instead, which is the
# harnessed-owned surface.
#
# Upstream writes these as generated scripts under $CLAUDE_CONFIG_DIR/hooks/ with the binary path
# baked in absolute. Inlined instead (as context-mode does): the recipe ships no files, and the
# command resolves through the same PATH the stdio server above resolves through — the mise shims
# dir, in both modes.
hooks:
  # Graph-augments text search. Despite upstream's legacy script name ("gate") this NEVER blocks a
  # call — it only prepends matching graph symbols as additionalContext, so the agent gets the
  # structural answer alongside the textual one. `command -v` + `exit 0` keep it silent-and-passing
  # on a stack where the binary somehow did not land; a PreToolUse hook that errors is noise on
  # every single Grep.
  #
  # STRUCTURAL skip on omp, same as context-mode's PreToolUse: the bridge never injects PreToolUse
  # additionalContext (verified against the published omp-claude-hooks-bridge 0.5.0 index.ts —
  # extractAdditionalContext runs only on the SessionStart and UserPromptSubmit paths; tool_call
  # applies decisions and input rewrites, never context), and augmentation-as-context is ALL this
  # hook does. Replaying it would spawn a shell per search to produce output nothing can deliver.
  # SessionStart below stays live there; its reminder item 4 covers the missing per-search nudge.
  PreToolUse:
    - matcher: Grep|Glob
      command: >-
        sh -c 'command -v codebase-memory-mcp >/dev/null 2>&1 &&
        codebase-memory-mcp hook-augment 2>/dev/null; exit 0'
      skip_harnesses: [omp]

  # No `matcher:` — an absent matcher fires on every SessionStart source (startup, resume, clear,
  # compact), which is exactly the four upstream enumerates one-by-one.
  SessionStart:
    - command: |
        # One guard for the whole hook, matching the `command -v` the PreToolUse hook already uses.
        # Without it the reminder below is unconditional: on a stack where the tool install failed
        # or the binary was removed, every session start would inject "ALWAYS use
        # codebase-memory-mcp tools FIRST" while the MCP server is absent, steering the agent at
        # tools that do not exist. The reminder and the index are worth exactly as much as the
        # binary, so they share its guard.
        command -v codebase-memory-mcp >/dev/null 2>&1 || exit 0

        cat <<'CBM_REMINDER'
        CRITICAL - Code Discovery Protocol:
        1. ALWAYS use codebase-memory-mcp tools FIRST for ANY code exploration:
           - search_graph(name_pattern/label/qn_pattern) to find functions/classes/routes
           - trace_path(function_name, mode=calls|data_flow|cross_service) for call chains
           - get_code_snippet(qualified_name) for exact symbol source (precise ranges)
           - query_graph(query) for complex Cypher patterns
           - get_architecture(aspects) for project structure
           - search_code(pattern) for text search (graph-augmented grep)
        2. Use the harness's own search and file-read tools freely for text, configs,
           and non-code files, and always read a file before editing it.
        3. If a project is not indexed yet, run index_repository FIRST.
        4. Some harnesses add no per-search graph augmentation. Route to the graph
           tools deliberately, and repeat this instruction in every subagent prompt
           you write.
        CBM_REMINDER

        # Index this checkout, because cbm will not (`auto_index = false`, see the mcp: comment).
        # Without this, only whatever checkout someone indexed by hand has a graph — every git
        # worktree opens graph-blind while the text above insists the graph tools come first.
        #
        # Keyed on `git rev-parse --show-toplevel`, NOT $PWD: a worktree's toplevel is its own dir,
        # which is the per-branch granularity wanted — a worktree's graph must reflect its branch,
        # not main's. Non-git cwd => no toplevel => nothing indexed, right answer for a scratch dir.
        #
        # UNCONDITIONAL, deliberately. An "only if missing" guard was measured and rejected: at
        # 0.9.0 a re-index costs 1.6s against 2.1s for a first index, so the guard buys ~0.5s and
        # pays with a graph that is right once and stale forever — precisely the failure AGENTS.md
        # warns about, made worse by the reminder above telling the agent to trust it. SessionStart
        # also fires on resume/clear/compact, which is exactly when a re-index is wanted.
        #
        # Not serialized against a concurrent index of the same project, deliberately. Concurrent
        # runs neither error nor corrupt the DB: node/edge counts are self-consistent within a burst
        # and drift slightly between bursts whether or not the runs overlap (cbm indexes multi-
        # threaded and its store is shared across projects), so a lock buys no determinism. The only
        # cost of an overlap is a duplicated ~2s index, which does not justify lockfile machinery.
        #
        # Detached and redirected on both streams: a SessionStart hook's stdout is injected into the
        # agent as context, so a stray progress line would read as instructions, and a foreground
        # index would stall every session start.
        if cbm_root=$(git rev-parse --show-toplevel 2>/dev/null); then
          ( codebase-memory-mcp cli index_repository --repo-path "$cbm_root" >/dev/null 2>&1 & )
        fi

  # Subagents inherit the tool list but not the session-start context, so they re-derive their own
  # search habits. SubagentStart injects via JSON `additionalContext`, NOT plain stdout — the raw
  # object is upstream's, with its tool-naming line rewritten harness-neutral.
  #
  # Skipped on omp: the bridge subscribes to no subagent event at all (0.5.0 index.ts — its
  # `before_agent_start` maps to UserPromptSubmit, not SubagentStart), so this entry could never
  # fire there. The skip records that as intent rather than accident. Reminder item 4 above
  # (repeat the instruction in every subagent prompt) is the omp fallback.
  SubagentStart:
    - matcher: "*"
      command: |
        cat <<'CBM_SUBAGENT'
        {"hookSpecificOutput":{"hookEventName":"SubagentStart","additionalContext":"Code discovery: prefer codebase-memory-mcp tools (search_graph, trace_path, get_code_snippet, query_graph, get_architecture, search_code) over grep/file-read for navigating code. Use the harness's own search and file-read tools for text, configs, and non-code files."}}
        CBM_SUBAGENT
      skip_harnesses: [omp]
