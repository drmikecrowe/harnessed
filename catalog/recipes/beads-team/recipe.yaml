# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: beads-team — bake the `bd` CLI (https://github.com/gastownhall/beads), a native binary, run
# in beads' in-repo, git-tracked mode on bd's SERVER storage engine (a managed per-container `dolt
# sql-server` on loopback, pidfile-managed, data under `.beads/dolt/`) — NOT the embedded engine,
# whose dependency subsystem (`bd dep add`/`close`/`delete`/`stats`/`sql`/`doctor`) is a no-op in bd
# 1.1.0 and whose shared-file lock contends under this bare+worktree layout. `.beads/` lives INSIDE
# the repo (git-tracked), `bd init` installs git hooks (agent-identity commit trailers) and auto-wires
# the git origin as a Dolt remote for `bd dolt push`/`bd dolt pull` sync — beads data is stored
# under `refs/dolt/data`, NOT a git branch, so this does not touch protected branches. No MCP, no
# service, no skill: the agent shells out to `bd` directly.
#
# This is the TEAM / no-shared-server cell of the beads 2×2 (placement × storage):
#   • beads-team          — this recipe: in-repo, git-tracked, per-container managed dolt server.
#   • beads-team-server   — in-repo, git-tracked, but points at the SHARED `beads-server` service.
#   • beads-stealth       — `.beads/` outside the repo, zero git footprint, embedded engine.
#   • beads-stealth-server — `.beads/` outside the repo, but live data on the SHARED `beads-server`.
# For fully-invisible use (`.beads/` outside the repo entirely — e.g. dogfooding this tool against
# harnessed's OWN repo), use `beads-stealth` instead. All four are the same tool with different
# storage/placement wiring, so `conflicts:` below prevents combining any two in one stack.
#
# Persistence: `.beads/` is `location: in_repo` (already inside the project's own mount — no extra
# bind-mount) with `vcs: tracked`, i.e. harnessed takes no .gitignore action: the item is meant to be
# committed, matching upstream's own default expectations. (bd manages its own finer-grained
# exclusions internally, e.g. `.beads/dolt/`.)
#
# Init: NOT automatic (see `setup:` below). `condition` (`! bd list`) makes it self-gating: the
# assembler synthesizes a Claude SessionStart hook from it that prints the summary once, then
# stays silent once `bd list` succeeds. `bd setup <tool> --project` (a separate step from `bd
# init`, per beads' docs/SETUP.md) writes `.claude/settings.json` + `CLAUDE.md` into the project on
# bd 1.1.0 — a real footprint, which is why this is a deliberate user action, not an every-attach
# auto-run.
name: beads-team
description: "bd (beads) — graph issue tracker / task memory, TEAM mode: in-repo, git-tracked, Dolt-native sync via the git origin (per-container managed dolt server)."
setup:
  summary: >-
    Run `bd init --server --quiet --non-interactive --role maintainer && bd config set
    dolt.auto-commit on` then `bd setup <harness> --project` once per workspace, then restart
    the agent; these steps create the in-repo .beads/ store, install git hooks, and wire the
    bd prime workflow into the harness.
  reference: https://github.com/gastownhall/beads
  condition: '! bd list >/dev/null 2>&1'

# agent-carnet is also a shared, cross-session notebook (see its own `rules:` entry instructing the
# agent to treat carnet as the SOLE memory store). Combining both in one stack gives the agent two
# competing persistent-memory systems and duplicate/contradictory workflow instructions. Also
# conflicts with every other beads variant — same tool, different .beads/ location + storage wiring;
# don't combine two variants in one stack.
conflicts: [agent-carnet, beads-stealth, beads-stealth-server, beads-team-server]

persist:
  - name: .beads
    scope: workspace
    location: in_repo
    vcs: tracked

# No `init:` — beads is NOT auto-initialized. bd's setup writes into the project
# (`.claude/settings.json` + `CLAUDE.md` on bd 1.1.0) and cannot be made reliably
# idempotent/footprint-free across every git layout, so first-time init is left to the user via
# `setup:` above (self-gated on Claude by `setup.condition` — see emit._recipe_hooks_settings).
