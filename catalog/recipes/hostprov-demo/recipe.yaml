# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: hostprov-demo — host-provision tracer. Installs a tiny uv-tool (pycowsay) to exercise the
# `launch --host` provisioner without a heavyweight download. No MCP/skill surface.
name: hostprov-demo
description: Host-provision tracer — installs pycowsay via the uv-tool backend.
provision:
  - via: uv-tool
    package: pycowsay
    version: "0.0.0.2"
    command: pycowsay
