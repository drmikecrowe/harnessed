# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: gstack — install a third-party skill suite by running its own upstream installer.
#
# The whole recipe is: do what gstack's install docs say (git clone + ./setup). ./setup bakes ~50
# skills into the agent config dir. The assembler can't see what an install script installs, so
# `expect:` lists a representative few for the capability test to probe.
name: gstack
description: Garry Tan's gstack skill suite (browser automation, design, PDF, …) installed via its upstream ./setup.
# setup: none needed — install.sh runs full upstream ./setup, no external account required

# gstack STRADDLES the install/system line, which is why this recipe keeps a Dockerfile:
#   * script:  the content half — fetch the pinned commit and run upstream's own ./setup. Runs in
#     BOTH modes, which is the fix for bd harnessed-8px.1 (a host launch used to get 0 gstack skills
#     and no warning). ./setup needs bun; install.sh checks for it and fails loudly if absent.
#   * system:  `bunx playwright install-deps chromium` needs USER root + apt. It STAYS in the
#     Dockerfile; declaring it here makes a host launch print the reason and skip it BY NAME.
#     harnessed never sudos and never mutates the user's system.
#   * refs:    the pin, as DATA, in ONE place (Phase 3 of #329). It used to be two literals kept in
#     lockstep by a comment — a `GSTACK_REF=` assignment in install.sh and `install.cache` here —
#     which is the defect that epic exists to delete. The script now reads
#     `$HARNESSED_REF_GSTACK` / `$HARNESSED_REPO_GSTACK` from the install env, and `harnessed
#     update` reads this block. Neither value is repeated in a comment, here or in the script: a
#     comment copy drifts the same way a shell variable does, only more quietly.
#   * cache:   DERIVED from `refs:` now (sha256 of `key=repo@ref`, first 16 hex) rather than
#     declared — declaring both is a schema error, not a precedence rule. It still keys the host
#     content cache ($XDG_CACHE_HOME/harnessed/install/gstack/<derived>) and still holds the pinned
#     SOURCE only — ./setup's output must be built against the live config dir, so it is not
#     cached. Bumping `ref:` moves the derived key, so a fresh cache dir follows automatically
#     instead of needing a second edit someone has to remember.
#
# The `hold:` is STRUCTURAL, not policy, and the difference matters: a policy hold can be lifted by
# a decision, and this one cannot be lifted by anything. Upstream has published no releases and no
# tags (measured 2026-08-09), so there is no version string for any resolver to return — a SHA is
# the only thing there is to pin. caveman and superpowers, by contrast, carry no hold at all: their
# upstreams publish releases, so AC-2 counts them resolvable. The repo name is deliberately not
# repeated in this paragraph; it is declared once below, and a comment copy drifts silently.
install:
  script: install.sh
  refs:
    gstack:
      repo: garrytan/gstack
      ref: 11de390be1be6849eb9a15f91ff4922dd16c589a
      hold: >-
        structural, not policy: upstream publishes no releases and no tags, so there is no version
        for a resolver to return and no policy to lift — a commit SHA is the only available pin.
        Bump by choosing a newer commit after a diff review.
  system: >-
    gstack drives a headless Chromium and needs Playwright's OS shared libraries
    (`bunx playwright install-deps chromium`), which is an apt install requiring root. Without it
    the browser binary downloads but chromium.launch() fails, so gstack's browser-automation skills
    will not work on a host launch. Run this stack in a container to get them.

# What the capability test must find in the running container after a successful build. gstack
# installs many skills into ~/.claude/skills (and no ~/.claude/commands); declare a stable few.
expect:
  skills: [gstack, office-hours, qa, plan-ceo-review, review]
