# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
name: gsd-core
description: >-
  GSD Core (opengsd.net) — a spec-driven-development skill/agent/workflow suite
  installed by its own upstream installer, pinned via tools: and invoked by install.sh.
# setup: none needed — install.sh runs the installer non-interactively, no external account required

# `tools:` owns the PACKAGE; install.sh RUNS it. Same division as serena (`tools:` installs the CLI,
# the script runs `serena init -b LSP`) — and the same reason it is safe: `_run_container_installs`
# and `_host_run_installs` both do `tools:` first, then every `install.script`, deliberately and in
# writing, so `gsd-core` is on PATH by the time the script below invokes it.
#
# This recipe is NOT a binary delivery. `@opengsd/gsd-core` ships three bins, and the default
# `gsd-core` one IS the installer that wrote the skills before (measured — S3 of the rtk-pattern
# spec). So `tools:` here is not "put a tool on PATH for the agent"; it is "fetch and pin the
# installer, once, declaratively", and the content it writes is still the deliverable.
#
# What this buys: the version literal leaves install.sh (AC-1), `harnessed update` can see the pin
# like any other `npm:` spec, and the package is fetched by mise's pnpm-backed npm backend rather
# than by a `pnpm dlx` inside the script.
#
# No `cache:` — `install.cache` keys a pinned CONTENT clone; the package comes from the npm
# registry, which mise and pnpm already cache.
# No `system:` — pure content under the agent config dir, nothing needs root, nothing is skipped.
tools:
  - npm:@opengsd/gsd-core@1.9.1

install:
  script: install.sh

expect:
  # Claude Code 2.1.88+ installs GSD's commands as skills (~/.claude/skills/gsd-*), not
  # ~/.claude/commands/ — verified against the built image. Agents (~/.claude/agents/gsd-*)
  # also land, but `expect:` has no agents field for the oracle to probe.
  skills: [gsd-new-project, gsd-plan-phase, gsd-execute-phase]
