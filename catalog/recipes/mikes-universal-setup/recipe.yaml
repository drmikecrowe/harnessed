# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: mikes-universal-setup — Mike's always-on rules + generic utility skills, published as a
# worked example of a personal baseline recipe. Previously lived only as an untracked local overlay
# (catalog/recipes.local/universal, gitignored, with skills symlinked to ~/.agents/skills/); this
# recipe is that content made portable and committed so others can see the shape of it.
#
# Tool-specific personal-workflow skills (obsidian-*, playwriter, ghostty) were deliberately left
# out — they assume tools not everyone uses, so they don't fit a "universal" example.
#
# agent-browser was dropped 2026-07-23: unused, and vendoring it was actively wrong — upstream
# (github.com/vercel-labs/agent-browser) installs a STUB SKILL.md that defers to the installed CLI
# precisely so the instructions never go stale. A frozen copy defeats that design.
name: mikes-universal-setup
description: "Mike's baseline rules (coding stance, tool preferences, confirmation gates, token economy) plus a set of generic utility skills — an example personal always-on setup."

# COMPANION TOOLS ASSUMED PRESENT. rules/rg and rules/fd name `rtk` and context-mode's
# `ctx_batch_execute` outright instead of hedging ("if your stack provides a reducer"), because this
# baseline is always composed alongside the rg/fd/rtk/context-mode recipes. The coupling is
# DELIBERATE, and the schema cannot express it — there is no recipe-to-recipe `requires:`, only
# `services:` for sidecars — so it is recorded here instead. The hedged phrasing was tried first and
# does not work: an abstract "some stacks add an output reducer" never fires at the moment you are
# reaching for rg, which is the only moment it would have to. If you lift this recipe WITHOUT those
# companions, those two rules name tools you do not have — drop the bullets rather than leave them
# dangling.
rules:
  # A reported problem is a symptom, not an accusation. Counterweight to coding-principles' "never
  # guess / state verified facts", which on its own turns a bug report into an attribution argument.
  # Posture only — it never widens scope; §3 Surgical changes still decides what gets touched, and
  # pre-existing lint/test noise is named and left alone.
  - path: rules/blameless-debugging
  - path: rules/coding-principles
  - path: rules/denied-commands
  # Anti-drift/anti-thrash working discipline: read-before-edit, re-read on correction, change
  # approach after repeated failure, finish the whole task before stopping.
  - path: rules/execution-discipline
  - path: rules/fd
  # Anti-sycophancy + response shape. coding-principles' Response Principles already said "skip
  # filler" and it was NOT enough on its own: a one-line bullet inside a coding rule never fires at
  # the moment a reply opens with "Great question". This is the same instruction given its own rule,
  # a NAMED blocklist of the actual openers, and a pre-send self-check. It borrows the BONES of the
  # simple-english skill (sentence-length caps, one word one meaning, active voice, condition before
  # command) rather than the full ASD-STE100 standard — full STE on conversation prose reads like a
  # maintenance manual and would bar the domain vocabulary these rules depend on.
  - path: rules/interaction-style
  # Anti-agentic-regression, not a docs style guide: comment ONLY what a competent reader would
  # reasonably delete (upstream workarounds, tuned constants, arbitrary-looking ordering, untested
  # defensive checks, deliberate convention breaks), as a terse marker plus a MANDATORY ticket/ADR/SHA
  # reference. The mandate is the anti-hallucination mechanism: a model cannot invent a ticket number
  # that resolves, so an uncitable rationale must be labelled as inference or omitted. Carries the
  # inverse duty too — read the reference before deleting what it guards.
  - path: rules/load-bearing-comments
  # Gates WHAT gets published (read what you didn't author; provenance; no private content).
  # stop-and-ask gates WHETHER. A secret scanner only catches key-shaped strings — this is the
  # semantic pass it can't do.
  - path: rules/pre-publish-review
  # Resolves the WHICH-WINS question the other rules leave open: user > harness tool policy > project
  # docs > rules > skills > memory. Deliberately capability-phrased, never naming a harness's tools —
  # a rule that names a binary is naming an example, so the harness decides the mechanism and the
  # rule keeps the intent. Also states that an index/graph/cache is a derived view, so authoritative
  # resolution wins for single-symbol truth.
  - path: rules/precedence
  # Prompt-injection baseline: instructions only from user/project, everything fetched or
  # tool-returned is data. Covers identity/rule overrides, secret disclosure, unvalidated
  # executable output, encoding and pressure tricks, and harmful-content refusals.
  - path: rules/prompt-defense
  - path: rules/rg
  - path: rules/stop-and-ask
  - path: rules/token-efficient
  # The cwd is session identity, not convenience: backgrounding snapshots the LIVE cwd, so a session
  # that wandered into a subdirectory gets keyed into the wrong transcript namespace and cannot be
  # resumed from the project root. Concrete instance of execution-discipline's drift failure; a
  # declared worktree switch is explicitly exempt.
  - path: rules/working-directory-stability

# Skills arrive two ways:
#   1. install.script FETCHES the UNMODIFIED third-party skills at pinned commit SHAs — they are NOT
#      vendored here (hand-copying meant drift + redistributing third-party content in the wheel with
#      no licence). This is a BRIDGE (bd harnessed-197): the vercel `skills` CLI is the intended
#      end state but cannot yet pin to a SHA or verify content on restore, so install.sh supplies the
#      pin+verify the ecosystem lacks. Sources: oakoss/agent-skills (5), blader/humanizer (1),
#      AminBlg/SimpleEnglish (1).
#   2. `skills:` below vendors the ones MODIFIED here (a fetch would discard the edits) or authored
#      here. Owner tags: [gsd] open-gsd/gsd-core, [kepano] kepano/obsidian-skills, [mine] here — MIT.
#      See README.md for the full provenance table and the outstanding LICENSE-notice obligations.
install:
  script: install.sh
  # The RECIPE-WIDE hold (bd harnessed-c5t). Kept alongside the per-ref holds below because its
  # reason is orthogonal to any ref's CLASS: it is about what this content IS, not about whether an
  # upstream publishes releases. It is also the floor — a ref added later without its own `hold:`
  # is still held rather than silently bumpable.
  hold: >-
    skill content: a skill is agent instructions executed with the agent's full tool permissions,
    so a compromised upgrade is prompt injection, not a CVE — no scanner in the osv/trivy/grype
    family vets it. Bump a ref below only after a human has read the diff of the new content.
  # The pins, as DATA, in ONE place (Phase 3 of #329). They used to be three `*_SHA=` assignments in
  # install.sh plus a hand-mashed cache key that truncated all three to 10 hex and drifted
  # independently of every one of them. `install.cache` is now DERIVED from these refs (sha256 of
  # the canonical `key=repo@ref` rendering, first 16 hex); declaring it as well is a schema error,
  # not a precedence rule.
  #
  # Every ref carries its OWN `hold:` naming its CLASS, because acceptance here is per REF and these
  # three are not all the same kind (#329 AC-2, §1 Family B, measured 2026-08-09):
  #   * oakoss  — Class B. Upstream publishes no releases and no tags, so no resolver has anything
  #     to return. STRUCTURAL: lifting the policy would change nothing.
  #   * blader, aminblg — Class C. Releases exist and the resolver CAN order the pinned SHA against
  #     them, but every tag postdates the pinned commit, so no tag re-expresses the shipped tree.
  #     POLICY, in D8's words, quoted rather than paraphrased.
  refs:
    oakoss:
      repo: oakoss/agent-skills
      ref: 0283bed313563d5677a0838f4bf921b03296cf6c
      hold: >-
        structural, not policy: upstream publishes no releases and no tags, so there is no version
        for a resolver to return and no policy to lift — a commit SHA is the only available pin.
    blader:
      repo: blader/humanizer
      ref: 1b48564898e999219882660237fde01bf4843a0f
      hold: >-
        policy (D8): SHA-pinned by design; the nearest tag is a content change, not a re-expression
        of this commit.
    aminblg:
      repo: AminBlg/SimpleEnglish
      ref: 379728b51981b6d2ee1de0f201164483a9648972
      hold: >-
        policy (D8): SHA-pinned by design; the nearest tag is a content change, not a re-expression
        of this commit.

# Fetched by install.sh — the capability test verifies they landed (the assembler cannot see what an
# install script installs, so we declare it). Keep in sync with install.sh.
expect:
  skills: [application-security, mermaid-diagrams, mise, python-uv, skill-management, humanizer, simple-english]

skills:
  # [kepano] DERIVED from kepano/obsidian-skills (MIT), with a local trigger-strengthening edit, so
  # it is vendored not fetched (a fetch would revert the edit). Provenance + the exact change are in
  # skills/defuddle/PROVENANCE.md; kepano's LICENSE ships in skills/defuddle/LICENSE.
  - path: skills/defuddle
  # (humanizer is no longer vendored — it is byte-identical to blader/humanizer@1b48564, so it is
  # fetched at a pinned SHA by install.sh alongside the oakoss five. See install.sh / harnessed-197.)
  # [gsd] DERIVED from open-gsd/gsd-core, then decoupled and modified here (no longer tracks
  # upstream). Attribution is owed and recorded; this is NOT a fetch candidate — the local version
  # is the one we want. Original: github.com/open-gsd/gsd-core (MIT).
  - path: skills/map-codebase
  # [mine] Origin unresolved — a GSD-flavoured TDD skill that matches NO commit in mattpocock/skills
  # (its once-assumed source) or open-gsd/gsd-core. Treated as authored-here until proven otherwise.
  - path: skills/tdd
  - path: skills/varlock                # [mine]
  - path: skills/wrangler               # [mine]
