# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: hyperpowers — Ryan Stortz / withzombies' markdown-first dev-workflow skill suite.
#
# Upstream (https://github.com/withzombies/hyperpowers, MIT) ships a Claude Code plugin whose
# real deliverables are a Claude-canonical skills/ (22) + commands/ (10) + agents/ (5) tree at the
# repo top level. `install.sh` clones the pinned commit and copies those trees verbatim into the
# agent config dir — the exact layout `claude plugin install` drops, minus the plugin-registry
# wrapping and the Claude-tool hooks. The assembler can't see what a script drops, so `expect:`
# lists a representative probe set for the capability test (the gstack pattern).
#
# No MCP, no service, no startup-hooks. The Claude-tool hook suite (SessionStart bootstrap, the
# PreToolUse/PostToolUse blockers, the Stop blockers) is GAP 2 — harnessed has no field that wires
# the `hooks` key of ~/.claude/settings.json — and is deferred. The skills load fully on demand.
name: hyperpowers
description: hyperpowers — markdown-first dev-workflow skill suite (brainstorming, planning, TDD, execution, review, verification) with repo-local task-doc tracking. Claude Code plugin skills/commands/agents baked in; Claude-tool hooks deferred (GAP 2).
setup:
  summary: >-
    Skills, commands, and agents from the upstream plugin are installed by the recipe's `install.sh`
    (at image build time, and again on every `--host` launch); no runtime initialization is
    required — slash commands and skills are available immediately in every session.
  reference: https://github.com/withzombies/hyperpowers

# The clone-and-copy, as ONE bash file run by BOTH executors: `RUN bash install.sh` in the derived
# image, and by the launcher after the host home is materialized on `launch --host`. The Dockerfile
# this replaced ran only in the former, so a host launch had 0 of the 22 skills (bd harnessed-8px.1).
#
# `cache:` MUST equal the HYPERPOWERS_REF pinned inside install.sh. It keys the host content cache
# ($XDG_CACHE_HOME/harnessed/install/hyperpowers/<sha>) so the per-launch re-run — mandatory,
# because the host home is rebuilt from scratch every launch — fetches once, not every time. The
# schema rejects a floating key; bump both together to upgrade, which yields a fresh cache dir.
#
# No `system:` — nothing here needs root (pure Markdown written under the agent config dir), so a
# host launch is fully equivalent to the container build.
install:
  script: install.sh
  cache: 7905547b6eb0665d631dd1e4f557e3863cd7a1b4

# What the capability test must find in the running container after a successful build. The full
# install lands 22 skills + 10 commands + 5 agents; declare a stable few (the README's core
# workflow skills + the using-hyper bootstrap + the four slash commands the workflow keys on).
# There is no `agents:` probe kind in the expect model — the 5 subagents are baked but not
# smoke-tested (verify manually).
expect:
  skills:
    - brainstorming
    - writing-plans
    - executing-plans
    - review-implementation
    - verification-before-completion
    - managing-task-docs
    - test-driven-development
    - debugging-with-tools
    - fixing-bugs
    - using-hyper
  commands:
    - brainstorm
    - write-plan
    - execute-plan
    - review-implementation
