# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: beads-shared — bake the `bd` CLI and point it at the SHARED `beads-server` service (a
# single standalone `dolt sql-server`) instead of provisioning a per-container Dolt engine (bead
# main-8by). This is the shared-service counterpart to the `beads` recipe: same `bd` binary, same
# in-repo git-tracked `.beads/` (config + JSONL export), but the live Dolt data lives on ONE server
# everyone connects to — removing the exclusive-file-lock contention behind the 2026-07-05 incident.
#
# How bd connects to the external server (the crux — this is a first-class, documented bd feature,
# NOT a workaround): `bd init --server --external --server-host <h> --server-port <p>`.
#   • --server    → use an external dolt sql-server instead of bd's embedded engine.
#   • --external  → the server is externally managed; bd connects but NEVER starts/stops it (that's
#                   the `beads-server` container's job). bd persists host/port to .beads/metadata.json.
#   • host.containers.internal:3307 → the pod's host-gateway reaches the loopback-published service
#     (the same address ping/gbrain/agentmemory peers use; 3307 = bd's own external-server default).
# Per-project isolation is multi-DATABASE-per-server: `bd init` (no --database) derives the database
# name from this project's issue prefix and creates it on the shared server, so each project gets its
# own Dolt database on the one server (design "multi-database-per-server"). Auth is loopback-only /
# none, so no BEADS_DOLT_PASSWORD is set.
#
# The service itself is attached at the STACK level (`claude_beads-shared`'s `services:` list), not
# via an MCP `service:` ref — a `dolt sql-server` speaks the MySQL wire protocol, not MCP, so it is
# NOT a hatago-proxied MCP server. The launcher starts it host-published on launch (see the stack).
#
# No MCP, no skill, no service ref here: the agent shells out to `bd` directly (same as `beads`).
name: beads-shared
description: "bd (beads) pointed at the shared beads-server dolt sql-server sidecar (external server; one Dolt database per project on a single server)."

# Same tool, different storage wiring — never combine with the embedded-engine `beads`/`beads-stealth`
# variants in one stack. `agent-carnet` is a competing persistent-memory system (see `beads`).
conflicts: [beads, beads-stealth, agent-carnet]

persist:
  - name: .beads
    scope: workspace
    location: in_repo
    vcs: tracked

init:
  # Model A (same as `beads`): `run` is sourced in the attach shell on EVERY launch; it self-gates
  # cheaply and exports BEADS_DIR into the same shell the agent then runs in.
  #
  # 1. `bd-resolve-beads-dir` — baked helper (Dockerfile) that points BEADS_DIR at the right work
  #    tree in a bare + linked-worktree layout; prints nothing for a normal repo, exits non-zero for
  #    a bare repo with no work tree on its default branch (so a misplaced `.beads` aborts the attach).
  # 2. Idempotent init self-gate: `bd list` succeeds iff the workspace already has a DB configured
  #    (its metadata.json already points at the shared server) → skip init. On a fresh workspace it
  #    fails → run `bd init --server --external …` to connect to the shared beads-server.
  #    `bd config set dolt.auto-commit on` then commits every write (including dependency edges,
  #    which are NOT in issues.jsonl) into the server's Dolt store.
  # 3. `bd-setup-agent` — (re)wires the agent hook every attach; itself idempotent.
  #
  # MVP scope is a FRESH server (empty DB): a NEW project's database is minted on the shared server.
  # Migrating an EXISTING repo's `.beads/dolt` history into the shared server is a deferred follow-up
  # (see PLAN.md). This recipe NEVER runs `bd init --reinit-local` (that would discard history).
  run: >-
    _bd="$(bd-resolve-beads-dir)" && { [ -z "$_bd" ] || export BEADS_DIR="$_bd"; }
    && (bd list >/dev/null 2>&1 || (bd init --server --external --server-host host.containers.internal --server-port 3307 --quiet --non-interactive --role maintainer && bd config set dolt.auto-commit on))
    && bd-setup-agent
