# yaml-language-server: $schema=../../../../schemas/recipe.schema.json
# Recipe: beads/stealth — bake the `bd` CLI (https://github.com/gastownhall/beads), a native binary
# that bundles embedded Dolt, run in FULLY INVISIBLE mode: `.beads/` never lives in the repo at all
# (host-persisted, bind-mounted at a fixed container path) and `--stealth` is passed throughout, so
# beads leaves zero git footprint. No MCP, no service, no skill: the agent shells out to `bd` directly.
#
# This is NOT beads' in-repo team mode — see the `beads/team` recipe for that (in-repo,
# git-tracked, Dolt-native sync via the git origin, hooks installed — the upstream default). Use
# beads/stealth for personal/dogfooding use where the tool must be completely invisible to
# collaborators and the host repo (e.g. running this against harnessed's OWN repo — see
# claude_review-harness).
#
# Persistence: `.beads/` is host-persisted under `scope: project` (git-common-dir keyed) so the
# same beads DB is shared across all worktrees of a checkout but NOT leaked across clones.
# The bind-mount target is the fixed container path $HOME/.beads, making BEADS_DIR a static Dockerfile
# ENV — no per-project path arithmetic needed at runtime.
#
# Init: NOT automatic (see `setup:` below). `condition` (`! bd list`) makes it self-gating: the
# assembler synthesizes a Claude SessionStart hook from it that prints the summary once, then
# stays silent once `bd list` succeeds. NOTE: `bd setup <tool> --stealth` still writes an
# UNTRACKED `.claude/settings.json` + `CLAUDE.md` on bd 1.1.0 (not in bd's stealth git-exclude
# list), so "stealth" is not fully footprint-free — the user opts into it knowingly.
name: beads-stealth
description: bd (beads), fully invisible mode — .beads/ lives outside the repo entirely, zero git footprint.
setup:
  summary: >-
    Run `bd init --quiet --stealth` then `bd setup <harness> --project --stealth` once per
    workspace, then restart the agent; these two steps initialize the host-persisted .beads/ store
    and wire the bd prime workflow into the harness before bd can track issues.
  reference: https://github.com/gastownhall/beads
  condition: '! bd list >/dev/null 2>&1'

# agent-carnet is also a shared, cross-session notebook (see its own `rules:` entry instructing the
# agent to treat carnet as the SOLE memory store). Combining both in one stack gives the agent two
# competing persistent-memory systems and duplicate/contradictory workflow instructions.
# The other beads varieties need no entry here: sibling varieties of one family are IMPLICITLY
# exclusive (see schema._check_recipe_conflicts).
conflicts: [agent-carnet]

persist:
  - name: .beads
    scope: project
    location: host

# No `init:` — beads is NOT auto-initialized (same rationale as `beads/team`; `bd setup --stealth`
# still leaves an untracked `.claude/settings.json` + `CLAUDE.md` footprint on bd 1.1.0, so it can't
# be made invisible automatically). `setup.condition` (above) checks the static BEADS_DIR
# (host-persisted mount — see Dockerfile); the assembler turns it into a self-gating Claude
# SessionStart hook — see emit._recipe_hooks_settings.
