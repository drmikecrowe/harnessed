# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: beads/stealth — bake the `bd` CLI (https://github.com/gastownhall/beads) as a pure CLIENT
# of the project's `beads-server` service, with `.beads/` OUTSIDE the repo: fully invisible
# placement, zero git footprint.
#
# The beads family is TWO recipes, and the only difference between them is PLACEMENT:
#   • beads/team    — `.beads/` in the repo, git-tracked, shared with the team.
#   • beads/stealth — this recipe: `.beads/` host-persisted outside the repo, zero git footprint.
# Storage is not an axis: both run the SAME engine, the `beads-server` service (one `dolt sql-server`
# per project). Embedded mode and the old `-server` variants are gone — see beads/team's recipe.yaml
# for the 2026-07-12 root cause (Dolt's exclusive flock + one `.beads` per checkout = N containers
# fighting over one data dir; embedded only turns that hard failure into a race).
#
# Use stealth for personal/dogfooding work where the tool must stay invisible to collaborators and to
# the repo — e.g. running harnessed against harnessed's OWN checkout.
#
# How bd connects:
#   `bd init --stealth --server --external --server-socket "$HARNESSED_BEADS_SERVER_SOCKET"`.
#   • --stealth  → invisible mode: git-exclude only, no repo hook install, no AGENTS.md mutation.
#   • --server / --external → use the externally-managed dolt sql-server; bd connects but NEVER
#     starts or stops it (that is the `beads-server` container's job).
#   • --server-socket → a UNIX SOCKET inside the bind-mounted `.beads/`, not host:port — a filesystem
#     object, so no network namespace and no published port (see beads/team for why TCP cannot work
#     across containers here). The launcher exports the path as $HARNESSED_BEADS_SERVER_SOCKET.
#
# NOTE: `bd setup <harness> --stealth` still writes an UNTRACKED `.claude/settings.json` + `CLAUDE.md`
# on bd 1.1.0 (neither is in bd's stealth git-exclude list), so "stealth" is not fully footprint-free
# — the user opts into that knowingly.
#
# No git sync in this placement: there is no in-repo `.beads/` and no Dolt remote to push to
# (`harnessed svc sync beads-server` is a beads/team affordance). The data lives on the host, keyed
# per checkout, and stays there.
name: beads-stealth
description: bd (beads), fully invisible placement — .beads/ lives outside the repo entirely, zero git footprint, on the project's beads-server (one dolt sql-server per project, over a unix socket).

# The entire build is now `install.sh` — `mise use -g github:gastownhall/beads@1.1.0` — run by BOTH
# the container build and `launch --host`; the Dockerfile is deleted. NO `system:`: the old
# Dockerfile's `USER root` section contained nothing but comments, so there is no root-level half to
# skip and a host launch is fully equivalent. This mattered: `setup:` below shells out to `bd`, and
# on `--host` nothing had ever installed it.
install:
  script: install.sh

setup:
  summary: >-
    Run `bd init --stealth --server --external --server-socket "${HARNESSED_BEADS_SERVER_SOCKET:?beads-server
    not attached — add `services: [beads-server]` to the stack}"` then `bd setup <harness> --project
    --stealth` once per workspace, then restart the agent; these steps point bd at this project's
    beads-server (creating its database there) and wire the bd prime workflow into the harness. The
    `:?` guard matters — bd accepts an EMPTY --server-socket and silently keeps its old TCP config. A
    workspace initialized BEFORE the server needs no migration step: the beads-server repoints its
    metadata.json at the socket on startup (bd itself refuses to re-init an initialized workspace),
    and your existing issue data is opened in place. No git sync in this placement — `.beads/` is
    outside the repo and there is no remote to push to.
  reference: https://github.com/gastownhall/beads
  condition: '! bd list >/dev/null 2>&1'

# agent-carnet is also a shared, cross-session notebook (its own `rules:` entry tells the agent to
# treat carnet as the SOLE memory store). Combining both gives the agent two competing persistent-
# memory systems and contradictory workflow instructions. Sibling varieties of one family are
# IMPLICITLY exclusive (schema._check_recipe_conflicts), so `beads/team` needs no entry here.
conflicts: [agent-carnet]

# THE knob. `location: host` is what makes this the STEALTH recipe: `.beads/` is host-persisted
# OUTSIDE the repo, so git never sees it. `scope: project` (git-common-dir keyed) shares one store
# across all worktrees of a checkout but never across clones. The `beads-server` service names this
# entry (`data.persist: .beads`) and bind-mounts the host dir it resolves to as its data dir — so the
# SERVICE follows the RECIPE's placement. Swapping to `beads/team` moves the storage into the repo;
# nothing else changes.
persist:
  - name: .beads
    scope: project
    location: host

# `bd` reads BEADS_DIR from its own environment on every invocation — the agent's, a hook's, a
# subshell's — so this is `env:`, the one recipe deliverable no script can provide.
#
# `{persist:.beads}` resolves against the entry above rather than hardcoding a path, because the two
# modes genuinely disagree: in the pod the dir is the bind-mount target ~/.beads, while on
# `launch --host` there is no mount and bd must be pointed at the real
# $XDG_DATA_HOME/harnessed/persist/beads-stealth/<git-common-dir-hash>/.beads. The beads-server
# service resolves the SAME entry for its data dir and serves the socket from inside it at
# $BEADS_DIR/run/mysql.sock (exported as $HARNESSED_BEADS_SERVER_SOCKET), so client and server still
# agree by construction — now in both modes.
env:
  BEADS_DIR: "{persist:.beads}"

# No `init:` — beads is NOT auto-initialized (same rationale as beads/team; `bd setup --stealth`
# still leaves an untracked `.claude/settings.json` + `CLAUDE.md` footprint on bd 1.1.0, so it cannot
# be made invisible automatically). `setup.condition` (`! bd list`) is self-gating: the assembler
# turns it into a Claude SessionStart hook that prints once, then stays silent once the workspace has
# a database (see emit._recipe_hooks_settings). It checks BEADS_DIR (the host-persisted store — see
# `env:` above).
