# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: beads — bake the `bd` CLI (https://github.com/gastownhall/beads), a native binary, run in
# beads' in-repo, git-tracked mode on bd's SERVER storage engine (a managed per-container `dolt
# sql-server` on loopback, pidfile-managed, data under `.beads/dolt/`) — NOT the embedded engine,
# whose dependency subsystem (`bd dep add`/`close`/`delete`/`stats`/`sql`/`doctor`) is a no-op in bd
# 1.1.0 and whose shared-file lock contends under this bare+worktree layout. `.beads/` lives INSIDE
# the repo (git-tracked), `bd init` installs git hooks (agent-identity commit trailers) and auto-wires
# the git origin as a Dolt remote for `bd dolt push`/`bd dolt pull` sync — beads data is stored
# under `refs/dolt/data`, NOT a git branch, so this does not touch protected branches. No MCP, no
# service, no skill: the agent shells out to `bd` directly.
#
# For fully-invisible use (`.beads/` outside the repo entirely, zero git footprint — e.g. dogfooding
# this tool against harnessed's OWN repo), see the sibling `beads-stealth` recipe instead.
# `conflicts: [beads-stealth]` below prevents combining both in one stack.
#
# Persistence: `.beads/` is `location: in_repo` (already inside the project's own mount — no extra
# bind-mount) with `vcs: tracked`, i.e. harnessed takes no .gitignore action: the item is meant to be
# committed, matching upstream's own default expectations. (bd manages its own finer-grained
# exclusions internally, e.g. `.beads/dolt/`.)
#
# Init (Model A): `init.run` is sourced in the attach shell on every launch; it self-gates (`bd
# list`) so `bd init` runs only when the workspace has no DB yet. See the `init:` block below.
#   1. `bd init --server --quiet --non-interactive --role maintainer` — creates .beads/ in the
#      project, installs git hooks, auto-wires the git origin as a Dolt remote if one exists, and
#      (via `--server`) provisions bd's managed dolt sql-server with its DB under `.beads/dolt/`.
#      `bd config set dolt.auto-commit on` then persists auto-commit to `.beads/config.yaml` so every
#      write (including dependency edges) commits to the Dolt store on disk — edges are NOT in
#      `.beads/issues.jsonl` (only counts are), so JSONL export alone would silently lose them.
#      `--non-interactive` is required since this runs in a headless one-shot container (no TTY);
#      `--role maintainer` is the sensible default for a project's home repo (the *contributor*
#      role — for an OSS fork-based workflow — is a manual `bd init --role contributor` override,
#      not something this recipe assumes).
#   2. `bd-setup-agent` — a harness-aware wrapper baked in the Dockerfile (branches on the
#      build-time ${HARNESS} ARG). For claude: `bd setup claude --project`, wiring the SessionStart
#      hook (.claude/settings.local.json, running `bd prime --hook-json`) + minimal CLAUDE.md
#      section. Per beads' docs/SETUP.md, `bd init` does NOT do this on its own — it must be a
#      separate `bd setup <tool>` call.
name: beads
description: "bd (beads) — graph issue tracker / persistent task memory for agents (default mode: in-repo, git-tracked, Dolt-native sync)."

# agent-carnet is also a shared, cross-session notebook (see its own `rules:` entry instructing the
# agent to treat carnet as the SOLE memory store). Combining both in one stack gives the agent two
# competing persistent-memory systems and duplicate/contradictory workflow instructions. Also
# conflicts with `beads-stealth` — same tool, two different .beads/ locations; don't combine both
# variants in one stack.
conflicts: [agent-carnet, beads-stealth]

persist:
  - name: .beads
    scope: workspace
    location: in_repo
    vcs: tracked

init:
  # Model A: `run` is sourced in the attach shell on EVERY launch (no host-side marker), so it must
  # self-gate cheaply and export BEADS_DIR into the same shell the agent then runs in.
  #
  # 1. `bd-resolve-beads-dir` — a baked helper (Dockerfile) that points BEADS_DIR at the right work
  #    tree in a bare + linked-worktree layout (the generic MAIN_REPO_DIR contract var is the *bare*
  #    dir there — the wrong answer for `.beads` placement — so this tool-specific resolution stays).
  #    It prints nothing for a normal repo (bd's own discovery is correct → BEADS_DIR stays unset),
  #    and exits non-zero for a bare repo with NO work tree on its default branch — the one layout
  #    where default-mode beads can't place a committable `.beads/`, so `run` fails and the attach
  #    aborts with a clear error rather than misplacing the DB. `export` runs in the current shell
  #    (a brace group, not a subshell), so BEADS_DIR reaches the agent process.
  # 2. Idempotent init self-gate: `bd list` succeeds iff the workspace already has a DB (same
  #    discovery `bd init` uses), so an already-initialized repo skips `bd init`. Required when the
  #    mounted project is ITSELF a beads workspace (e.g. harnessed's own repo, whose `.beads` DB is
  #    anchored to the bare common dir `.bare/.beads`).
  # 3. `bd-setup-agent` — (re)wires the agent hook every attach; itself idempotent.
  run: >-
    _bd="$(bd-resolve-beads-dir)" && { [ -z "$_bd" ] || export BEADS_DIR="$_bd"; }
    && (bd list >/dev/null 2>&1 || (bd init --server --quiet --non-interactive --role maintainer && bd config set dolt.auto-commit on))
    && bd-setup-agent
