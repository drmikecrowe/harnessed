# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/recipe.schema.json
# Recipe: beads/team — bake the `bd` CLI (https://github.com/gastownhall/beads) as a pure CLIENT of
# the project's `beads-server` service, with `.beads/` IN THE REPO and git-tracked.
#
# The beads family is now TWO recipes, and the only difference between them is PLACEMENT:
#   • beads/team    — this recipe: `.beads/` in the repo, git-tracked, shared with the team.
#   • beads/stealth — `.beads/` outside the repo entirely, zero git footprint.
# Storage is no longer an axis: both run the SAME engine, the `beads-server` service (one
# `dolt sql-server` per project). The old `-server` variants (`beads/team-server`,
# `beads/stealth-server`) are gone — every cell is a server cell now.
#
# Why embedded is gone, and why bd no longer runs its own server (2026-07-12 root cause):
# Dolt takes an EXCLUSIVE flock on its data dir. `bd init --server` spawned a dolt sql-server PER
# CONTAINER, and every container in a bare+worktree checkout resolves to the SAME `.beads` (bd keys
# it off the git common dir — verified with `bd where`), so the first container won and every other
# one looped forever on `database "dolt" is locked by another dolt process`. Embedded is no escape:
# same engine, same flock, merely held per-command — a race instead of a hard failure. ONE server per
# project with N clients removes the contention by construction.
#
# How bd connects: `bd init --server --external --server-socket "$HARNESSED_BEADS_SERVER_SOCKET"`.
#   • --server   → use a dolt sql-server, not the embedded engine.
#   • --external → the server is externally managed; bd connects but NEVER starts or stops it
#                  (that is the `beads-server` container's job).
#   • --server-socket → a UNIX SOCKET inside the bind-mounted `.beads/`, not host:port. A socket is a
#     filesystem object, so it needs no network namespace and no published port. This matters: bd
#     records the server's port in shared state, but 127.0.0.1 means something DIFFERENT in every
#     container's netns, so TCP could never have worked across containers anyway.
# The launcher exports $HARNESSED_BEADS_SERVER_SOCKET into the attach shell (launcher.svc_socket_env),
# so the path never has to be hand-computed.
#
# The service is attached at the STACK level (its `services:` list), not via an MCP `service:` ref —
# a dolt sql-server speaks the MySQL wire protocol, not MCP, so it is not hatago-proxied. No MCP, no
# skill: the agent shells out to `bd` directly.
name: beads-team
description: "bd (beads) — graph issue tracker / task memory, TEAM placement: .beads/ in the repo, git-tracked, on the project's beads-server (one dolt sql-server per project, reached over a unix socket)."

# The entire build is now `install.sh` — `mise use -g github:gastownhall/beads@1.1.0` — run by BOTH
# the container build and `launch --host`; the Dockerfile is deleted. NO `system:`: the old
# Dockerfile's `USER root` sections contained nothing but comments, so there is no root-level half
# to skip and a host launch is fully equivalent. This mattered: `setup:` below shells out to `bd` on
# every launch, and on `--host` nothing had ever installed it.
install:
  script: install.sh

setup:
  summary: >-
    Run these INSIDE the agent session, not in your own shell — they read the connection details
    the launcher exports into the agent's environment and nowhere else. In Claude Code, prefix the
    line with `!` to run it in the session:
    `!bd init --server --external --server-port "${BEADS_DOLT_SERVER_PORT:?beads-server not
    attached — add 'services: [beads-server]' to the stack}"` then `bd setup <harness> --project`
    once per workspace, then restart the agent; these steps point bd at this project's beads-server
    (creating its database there) and wire the bd prime workflow into the harness. Host, user,
    password and the auto-start interlock come from the environment, so only the port is passed
    explicitly — as the `:?` guard, which is the one check that the service is actually attached.
    Git sync is a HOST command: `harnessed svc sync beads-server --stack <stack>` — `bd dolt push`
    from inside an agent is not supported (see the README).
  reference: https://github.com/gastownhall/beads
  condition: '[ ! -f "$(git rev-parse --git-common-dir)/.beads/metadata.json" ]'
  # NO `run:` — team is initialized BY THE USER, deliberately. Two independent reasons:
  #
  # 1. `bd init` in this placement COMMITS. It creates 18 files (AGENTS.md, CLAUDE.md, .codex/,
  #    .claude/settings.json, .agents/skills/beads/**) and commits them unprompted — verified on bd
  #    1.1.0. Doing that to a SHARED repo on the user's behalf is their call, not harnessed's.
  #    (beads/stealth does auto-init, because `--stealth` writes no commit and tracks nothing.)
  #
  # 2. What used to be here was actively harmful:
  #        bd init --shared-server --database {config.database} --prefix {config.prefix}
  #    No `--external`, no `--server-socket` — so auto-start stayed ENABLED — pointed at bd's global
  #    `~/.beads/shared-server`, one server for every project on the machine. That is the exact
  #    configuration behind the 2026-07-19 incident (BEADS.md §10): a host `bd` with auto-start live
  #    initialized its own data dir as a database, and the project database became unreachable for
  #    five days. It landed in 0790b7d on 2026-07-16 — the same date as this workspace's
  #    `metadata.json.bak-before-shared-reinit`.
  #
  # `setup.summary` above still fires, and `_prompt_setup_notices` now blocks the launch on it in
  # BOTH modes, so a user on a fresh team checkout is stopped and told what to run rather than
  # silently handed an auto-started server.

# `agent-carnet` is also a shared, cross-session notebook (its own `rules:` entry tells the agent to
# treat carnet as the SOLE memory store). Combining both gives the agent two competing persistent-
# memory systems and contradictory workflow instructions. Sibling varieties of one family are
# IMPLICITLY exclusive (schema._check_recipe_conflicts), so `beads/stealth` needs no entry here.
conflicts: [agent-carnet]

# THE knob. `location: in_repo` + `vcs: tracked` is what makes this the TEAM recipe: `.beads/` is
# committed and shared. The `beads-server` service names this entry (`data.persist: .beads`) and
# bind-mounts whatever host dir it resolves to as its data dir — so the SERVICE follows the RECIPE's
# placement. Swapping to `beads/stealth` moves the server's storage with it; nothing else changes.
persist:
  - name: .beads
    scope: project
    location: in_repo
    vcs: tracked

# `bd` reads BEADS_DIR from its own environment on EVERY invocation — the agent's, a hook's, a
# subshell's — and only falls back to a git-common-dir walk when it is unset. That fallback needs the
# CALLER to be standing inside the repo, which is true for claude (its bd hooks run with the project
# as CWD) but NOT for every harness: omp starts the agent in $HOME (/home/harnessed), and from there
# the walk finds no `.beads`, so `bd where` reports "No active beads workspace found" and the agent
# mis-narrates it as "the Dolt server isn't running" (harnessed-b0s). Exporting BEADS_DIR makes bd
# CWD-independent. `{persist:.beads}` resolves against the entry above (in_repo -> the checkout's
# git-common-dir `.beads`, path-preserving in both container and host modes), so client and the
# beads-server service — which resolves the SAME entry for its data dir — agree by construction.
# beads/stealth already carries this env for the identical reason; team needs it just as much.
env:
  BEADS_DIR: "{persist:.beads}"
  # NO connection variables here any more. Host, port, user, password and BEADS_DOLT_AUTO_START are
  # declared by the SERVICE (`client_env:` in services/beads-server/service.yaml) and injected by
  # the launcher per launch, because the published port does not exist until the container is
  # running — a recipe `env:` value is resolved at emit time, which is too early.
  #
  # What does NOT change is D6: every one of those values is still machine-local and delivered by
  # environment, never written to metadata.json or config.yaml. That is what keeps TEAM placement
  # honest — metadata.json is part of bd's TRACKED surface, so anything machine-specific recorded
  # there travels to every teammate as a path or port from someone else's box. A teammate without
  # harnessed inherits none of these vars and gets bd's ordinary behaviour. See BEADS.md §4.

# No `init:` — beads is NOT auto-initialized. bd's setup writes into the project
# (`.claude/settings.json` + `CLAUDE.md` on bd 1.1.0) and cannot be made reliably
# idempotent/footprint-free across every git layout, so first-time init stays a deliberate user
# action via `setup:` above. `setup.condition` (`! bd list`) makes it self-gating: the assembler
# synthesizes a Claude SessionStart hook that prints the summary once, then stays silent once the
# workspace has a database (see emit._recipe_hooks_settings).
