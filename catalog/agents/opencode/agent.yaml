# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/agent.schema.json
type: agent
harness: opencode
image: harnessed-opencode
dockerfile: catalog/base/Dockerfile.harnessed-opencode
# Pinned tool versions for the image build (passed as --build-arg). Single source of truth — the
# Dockerfile's matching ARG carries no default. `spec:` names the upstream `harnessed update`
# queries; the Dockerfile still performs the install (the vendor installer takes --version).
build_args:
  OPENCODE_VERSION: {value: "1.18.15", spec: "github:sst/opencode"}
description: >
  opencode (sst/opencode) harness. FROM harnessed-base + a pinned opencode via the official
  installer (real Bun binary, not the blocked npm postinstall wrapper). Reads .claude/skills/**
  and ~/.claude/CLAUDE.md natively; MCP via a baked ~/.config/opencode/opencode.json pointing at
  hatago (opencode ignores .mcp.json).
