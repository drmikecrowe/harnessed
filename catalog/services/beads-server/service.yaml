# yaml-language-server: $schema=https://raw.githubusercontent.com/drmikecrowe/harnessed/main/schemas/service.schema.json
# Service: beads-server — the ONE `dolt sql-server` for a project. Every `bd` in every agent
# container is a client of it; nothing else ever opens the Dolt data dir.
#
# Why (the 2026-07-05 lock incident, root-caused 2026-07-12): Dolt takes an EXCLUSIVE flock on its
# data dir. `bd` in server mode spawns its OWN dolt sql-server per container, and every container in
# a bare+worktree checkout resolves to the SAME `.beads` (bd keys it off the git common dir —
# verified with `bd where`). The first container to start won; every other one looped forever on
# `database "dolt" is locked by another dolt process`. Embedded mode is not a fix either: same
# engine, same flock, just held per-command — a race instead of a hard failure. ONE server per
# project with N clients is the only shape that removes the contention by construction.
#
# scope: project — one container per project (git-common-dir keyed), NOT a global singleton. The
# server holds an exclusive lock on per-project data, so it is inherently unshareable; a singleton
# would only relocate the collision.
#
# PORT, not socket — reversed 2026-07-26, and the reasoning is worth keeping because the socket
# argument was correct about everything except the client.
#
# The socket form was chosen for two reasons. The stated one (no netns, no port allocation) still
# holds. The load-bearing one was BEADS.md D1: socket mode is the only configuration that disables
# bd's auto-start, and auto-start is what destroyed this workspace for five days in §10 — bd,
# unable to reach a server, spawns one chdir'd into the data dir with no --data-dir and initializes
# that directory as a database.
#
# D1's premise is stale. `BEADS_DOLT_AUTO_START` is an environment variable bd reads (confirmed
# against the 1.1.0 binary alongside BEADS_DOLT_SERVER_{HOST,PORT,USER,MODE,DATABASE} and
# BEADS_DOLT_PASSWORD), so the interlock can be delivered exactly the way the socket path was —
# machine-locally, never persisted, invisible to a teammate without harnessed. D6 is untouched.
#
# What the socket could NOT do is serve a client that speaks TCP for part of its work, and bd does:
# it writes the socket into metadata.json, then verifies over TCP. With nothing published, `bd
# init` ends on `Server: root@127.0.0.1:0` + "Failed to connect to Dolt server", and `bd doctor`
# on a perfectly healthy workspace reports "no Dolt server port configured". Correct setup that
# prints failure is a design defect, not a message to explain away.
#
# `publish: stable` (was `ephemeral`, 2026-07-27) gives the port WITHOUT letting it move. harnessed
# allocates one free loopback port per project, once, and records it in
# $XDG_DATA_HOME/harnessed/svc-ports.json. N per-project sidecars still cannot collide — the
# registry is machine-wide, so an allocation can see what every other project was promised.
#
# Ephemeral was the wrong half of that trade. "Nothing is written down, so nothing goes stale" also
# means nothing OUTSIDE a harnessed launch can ever be configured: a plain `bd` in the repo, a
# `claude` the user started themselves, a hook. Those clients are not an edge case — on 2026-07-27
# every live agent in a project had zero BEADS_ variables, so bd fell back to auto-start, hit the
# sidecar's exclusive lock, and told the user to run `bd bootstrap`. A port that survives a reboot
# is what lets the PROJECT hold its own beads config (mise.local.toml) instead of that config
# existing only inside a harnessed process. The loopback trap the socket avoided is handled by
# `client_env` `{host}`,
# which resolves per mode — 127.0.0.1 for a host agent, host.containers.internal for a container.
#
# Dropping the socket also takes a unix socket back out of the user's source tree. At
# `<repo>/.beads/run/mysql.sock` it was a non-file that any file-walking tool in the same stack
# tripped over — serena's indexer failed on it with "No such device or address" (2026-07-26).
#
# data.persist: .beads — the service does NOT choose where its bytes live; the RECIPE does.
# `beads/team` declares `.beads` as `location: in_repo` (git-tracked, shared with the team);
# `beads/stealth` declares it `location: host` (outside the repo, zero git footprint). The launcher
# bind-mounts whichever the stack's beads recipe declared at /data. That is the single knob.
name: beads-server
image: harnessed-beads-server:latest
scope: project
port: 3307          # the CONTAINER port; the host side is allocated ONCE per project
publish: stable
data:
  persist: .beads

# What a `bd` client needs to reach this server. Declared HERE because only this service knows
# bd's variable names — the launcher resolves the templates and injects them, knowing nothing
# about beads. Every value is machine-local and environment-delivered: none is written to disk,
# so `metadata.json` and `config.yaml` stay clean and a teammate without harnessed inherits none
# of it and gets bd's ordinary behaviour (BEADS.md requirement 2, D6).
client_env:
  BEADS_DOLT_SERVER_MODE: server
  BEADS_DOLT_SERVER_HOST: "{host}"
  BEADS_DOLT_SERVER_PORT: "{port}"
  BEADS_DOLT_SERVER_USER: root
  BEADS_DOLT_PASSWORD: "{password}"
  # The interlock that D1 used to get from socket mode. Without it, a client that cannot reach
  # this server spawns its own dolt chdir'd into the data dir and initializes it as a database —
  # BEADS.md §10, five days of "database not found" over intact bytes.
  BEADS_DOLT_AUTO_START: "false"

# MySQL-auth healthcheck: the server is up AND root can authenticate. Runs INSIDE the container,
# so it dials the container port directly and never needs to know the published one.
# NOTE: dolt 2.1.10 has NO `sql-client` subcommand (`Unknown Command sql-client` — the healthcheck
# that used to live here therefore could never pass). The global --host/--port/--user flags on
# `dolt sql` are the supported client form, and --no-tls is required (the server speaks no TLS).
# The password now comes from the environment: an empty --password stopped working the moment the
# entrypoint started requiring one (see below), and a healthcheck that authenticates differently
# from every real client is a healthcheck that passes while every client fails.
healthcheck: "dolt --host 127.0.0.1 --port 3307 --user root --password \"${HARNESSED_SVC_PASSWORD}\" --no-tls sql -q 'SELECT 1' >/dev/null 2>&1 || exit 1"

# exclusive_lock — makes the invariant above ("nothing else ever opens the Dolt data dir") an
# enforced precondition instead of a documented hope. The sidecar removes contention BETWEEN
# CONTAINERS by construction, but a HOST dolt sql-server on the same data dir still wins the flock
# and leaves this container dead on arrival (observed 2026-07-21, harnessed-9rw: a host server
# started 20min before the launch; the sidecar exited 1 with `database "dolt" is locked by another
# dolt process`, and every in-container `bd` then failed against a socket that was never created).
# A host dolt server is routine here — `--host` launches and stray host `bd` calls both start one.
exclusive_lock: dolt

# Git sync (in-repo placement only): `bd dolt push` writes the Dolt history to refs/dolt/data on the
# project's git origin. It MUST run HERE — bd's push shells out to the dolt CLI, which routes only to
# a server on its OWN loopback; the identical command from a client container dies with
# `dial tcp [::1]:3307: connect: connection refused` (verified). Invoke with
# `harnessed svc sync beads-server --stack <stack>`. Explicit, never automatic: it writes to a remote.
sync: "cd \"${HARNESSED_PROJECT_DIR:?git sync requires in-repo placement (beads/team)}\" && bd dolt push"
