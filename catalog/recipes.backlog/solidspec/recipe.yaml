# yaml-language-server: $schema=../../../schemas/recipe.schema.json
# Recipe: solidspec — multi-methodology spec-driven development CLI (spec → plan → tasks →
# implement → ship). Bakes the Rust binary at build time (see Dockerfile).
#
# No MCP, no service, no skill shipped: upstream offers none (init writes slash commands +
# an AGENT.md into agent dirs, not a ~/.claude/skills dir). Project-scoped slash commands
# come from `solidspec init` at runtime, not from this recipe.
name: solidspec
description: solidspec — multi-methodology spec-driven development CLI (spec → plan → tasks → implement → ship).

# Per-project scaffolding (`.solidspec/` + agent slash commands) is a runtime, per-project
# operation the build-time Dockerfile can't reach, so it is NOT auto-run (see
# docs/guides/recipe-authoring.md — recipes hint setup, they don't auto-init every agent).
# Surfaced instead via the harness-agnostic `setup:` note below.
setup:
  summary: >-
    Run `solidspec init --here --no-git` once per project to scaffold `.solidspec/` and register
    slash commands, then restart your agent.
  reference: https://github.com/jyjeanne/solidspec
