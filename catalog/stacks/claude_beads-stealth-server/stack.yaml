# yaml-language-server: $schema=../../../schemas/stack.schema.json
# Stack: claude_beads-stealth-server — claude + the beads-stealth-server recipe + the shared
# beads-server service.
# Naming: <agent>_<recipe> (claude + beads-stealth-server).
#
# Stealth-server cell of the beads 2×2: `.beads/` lives OUTSIDE the repo (host-persisted, zero git
# footprint) but the live Dolt data lives on the SHARED `beads-server` sidecar (a standalone `dolt
# sql-server`) instead of a per-container embedded engine — dodging the exclusive-file-lock collision
# stealth/embedded mode otherwise risks between a host `bd` and a container `bd`.
#
# The `beads-server` sidecar is attached by reference via the `services:` list below; the launcher
# starts it host-published on loopback :3307 at launch, idempotently, outliving the instance
# (`_ensure_services` → `_ensure_service`). The `beads-stealth-server` recipe's init points `bd` at
# it (`host.containers.internal:3307`, external-server mode). Like `claude_beads-team-server`, this
# service is NOT an MCP `service:` ref — a dolt sql-server speaks MySQL, not MCP — so it is declared
# ONLY at the stack level, which is exactly what `services:` is for.
name: claude_beads-stealth-server
harness: claude
recipes: [beads-stealth-server]
services: [beads-server]
