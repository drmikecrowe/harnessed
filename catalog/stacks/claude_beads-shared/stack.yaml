# yaml-language-server: $schema=../../../schemas/stack.schema.json
# Stack: claude_beads-shared — claude + the beads-shared recipe + the shared beads-server service.
# Naming: <agent>_<recipe> (claude + beads-shared).
#
# The `beads-server` sidecar (a standalone `dolt sql-server`) is attached by reference via the
# `services:` list below; the launcher starts it host-published on loopback :3307 at launch,
# idempotently, outliving the instance (`_ensure_services` → `_ensure_service`). The `beads-shared`
# recipe's init points `bd` at it (`host.containers.internal:3307`, external-server mode). Unlike
# `ping`/`gbrain`, this service is NOT an MCP `service:` ref — a dolt sql-server speaks MySQL, not
# MCP — so it is declared ONLY at the stack level, which is exactly what `services:` is for.
name: claude_beads-shared
harness: claude
recipes: [beads-shared]
services: [beads-server]
