# yaml-language-server: $schema=../../../schemas/stack.schema.json
# Stack: claude_tokensave — semantic code knowledge graph recipe (contingent on the hatago consolidation).
# Naming: <agent>_<recipe> (claude + tokensave).
#
# tokensave is a stdio MCP child that hatago spawns in-container. Builds/assembles cleanly now, but
# indexing only works once hatago lands in the harness container and bind-mounts the project.
name: claude_tokensave
harness: claude
recipes: [tokensave]
services: []
