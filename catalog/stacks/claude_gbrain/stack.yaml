# yaml-language-server: $schema=../../../schemas/stack.schema.json
# Stack: claude_gbrain — Claude + the gbrain shared knowledge-brain service.
# Naming: <agent>_<recipe> (claude + gbrain).
#
# The launcher runs ensure_service_up(gbrain) on launch (design §9), host-published on 3112.
# v1 prerequisite: the operator supplies a pgvector-enabled Postgres `DATABASE_URL` (Supabase/Neon/
# self-hosted) and the long-lived bearer (`GBRAIN_TOKEN`) via env / .env.schema — neither is
# harnessed-managed. Real secrets belong in the user-overlay recipe; this committed stack assembles
# with the `${GBRAIN_TOKEN}` placeholder in place.
name: claude_gbrain
harness: claude
recipes: [gbrain]
services: [gbrain]
