# Analysis tools that are not Python packages, so they cannot live in pyproject's dev extra.
# Declared and pinned here rather than assumed present: a check that only runs on a machine where
# someone happened to install the binary is not a check this project has. Versions are the ones
# verified against this tree, not guesses.
[tools]
shellcheck = "0.11.0"
"npm:pyright" = "1.1.411"

[env]
# Keep the venv outside the repo: `uv` running inside a podman container that
# bind-mounts this repo can corrupt a .venv/ living under the mount. One venv
# per branch avoids cross-branch dependency clobbering.
_BRANCH = "{{exec(command=\"git branch --show-current\")}}"
UV_PROJECT_ENVIRONMENT = "{{env.HOME}}/.local/share/harnessed/venvs/{{env._BRANCH}}/.venv"
_.source = "{{env.UV_PROJECT_ENVIRONMENT}}/bin/activate"

# Pin the local venv to the FLOOR of requires-python (>=3.12), which is also what CI's default
# job runs. Left unpinned, uv picks the newest interpreter on the box (3.13 here), so no local
# run exercises the version CI uses or the version the project claims to support -- and any
# behavioural difference between the two is invisible by construction. That is not theoretical:
# `Path.resolve()` raises on a failing readlink under 3.12 and swallows it under 3.13, which hid
# a real crash in catalogseed through a full local review (bd harnessed-925). CI covers the top
# of the range with a 3.13 matrix leg; local covers the floor.
UV_PYTHON = "3.12"

# docs/ is a live clone of the GitHub wiki, which publishes pages under a FLAT namespace
# (guides/beads.md is served at /wiki/beads). Relative links therefore look correct on disk and
# break once rendered on the wiki -- so the rewrite is a task, not a habit. Run `docs` after
# editing the wiki; `docs-check` is the read-only form for CI or a pre-push hook.
[tasks.docs]
description = "Rewrite docs/ wiki links to their absolute form and check the sidebar is complete"
run = "python3 tools/wiki-links.py"

[tasks.docs-check]
description = "Report docs/ wiki link and sidebar problems without writing (exits non-zero)"
run = "python3 tools/wiki-links.py --check"

[tasks.pull-and-build]
run = 'git pull && uv tool install --editable .'
