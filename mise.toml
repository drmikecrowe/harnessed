# Analysis tools that are not Python packages, so they cannot live in pyproject's dev extra.
# Declared and pinned here rather than assumed present: a check that only runs on a machine where
# someone happened to install the binary is not a check this project has. Versions are the ones
# verified against this tree, not guesses.
[tools]
shellcheck = "0.11.0"
"npm:pyright" = "1.1.411"
# varlock resolves .env.schema files; required by A6 in test_external_contracts_live.py.
# Version 1.16.1 is verified against this tree (2026-08-18). The binary name is `varlock`.
"npm:varlock" = "1.16.1"
# openwiki generates and maintains the agent-facing wiki under openwiki/ (see the openwiki-* tasks
# below). 0.4.3 is the version verified against this tree (2026-08-29); `latest` would make the
# provider env-var contract in tools/openwiki.sh an unpinned assumption.
#
# The two escape hatches are both REQUIRED, and both fail in a way that does not look like a
# packaging problem:
#   * trust_policy_excludes — fastq ships no provenance attestation at 1.20.2, so aube's
#     no-downgrade trust policy refuses the whole install.
#   * allow_builds — mise installs through aube, which DENIES dependency lifecycle scripts by
#     default. better-sqlite3 is a native addon whose `install` script is what produces
#     better_sqlite3.node; denied, the install still reports success and every openwiki run dies
#     at "Could not locate the bindings file" with a 14-line list of paths it tried. It reaches
#     openwiki transitively, through @langchain/langgraph-checkpoint-sqlite.
"npm:openwiki" = { version = "0.4.3", trust_policy_excludes = ["fastq@1.20.2"], allow_builds = ["better-sqlite3"] }

[env]
# Keep the venv outside the repo: `uv` running inside a podman container that
# bind-mounts this repo can corrupt a .venv/ living under the mount. One venv
# per branch avoids cross-branch dependency clobbering.
_BRANCH = "{{exec(command=\"git branch --show-current\")}}"
UV_PROJECT_ENVIRONMENT = "{{env.HOME}}/.local/share/harnessed/venvs/{{env._BRANCH}}/.venv"
_.source = "{{env.UV_PROJECT_ENVIRONMENT}}/bin/activate"

# Pin the local venv to the FLOOR of requires-python (>=3.12), which is also what CI's default
# job runs. Left unpinned, uv picks the newest interpreter on the box (3.13 here), so no local
# run exercises the version CI uses or the version the project claims to support -- and any
# behavioural difference between the two is invisible by construction. That is not theoretical:
# `Path.resolve()` raises on a failing readlink under 3.12 and swallows it under 3.13, which hid
# a real crash in catalogseed through a full local review (bd harnessed-925). CI covers the top
# of the range with a 3.13 matrix leg; local covers the floor.
UV_PYTHON = "3.12"

# docs/ is a live clone of the GitHub wiki, which publishes pages under a FLAT namespace
# (guides/beads.md is served at /wiki/beads). Relative links therefore look correct on disk and
# break once rendered on the wiki -- so the rewrite is a task, not a habit. Run `docs` after
# editing the wiki; `docs-check` is the read-only form for CI or a pre-push hook.
[tasks.docs]
description = "Rewrite docs/ wiki links to their absolute form and check the sidebar is complete"
run = "python3 tools/wiki-links.py"

[tasks.docs-check]
description = "Report docs/ wiki link and sidebar problems without writing (exits non-zero)"
run = "python3 tools/wiki-links.py --check"

[tasks.pull-and-build]
run = 'git pull && uv tool install --editable .'

# Catalog and mise.toml pin upgrades land as their own dated PR rather than riding along with
# unrelated work, so a bad pin can be reverted as a unit.
[tasks.upgrade-pr]
description = "Branch, commit catalog/ + mise.toml upgrades, push, open a PR, return to main"
run = '''
set -euo pipefail
day="$(date +%Y-%m-%d)"
branch="upgrade-$day"

git switch -c "$branch"
git add catalog mise.toml
git commit -S -m "chore(catalog): upgrade pins $day"
git push -u origin "$branch"
gh pr create --base main --head "$branch" \
  --title "chore(catalog): upgrade pins $day" \
  --body "Automated pin upgrade for $day. Covers \`catalog/\` and \`mise.toml\`."
git switch main
'''

# openwiki writes the agent-facing wiki to openwiki/ and keeps a pointer block in AGENTS.md and
# CLAUDE.md current. Its whole provider config lives in ~/.config/harnessed/.env.schema, so these
# tasks are just `varlock run` — nothing here needs to know a variable name or an endpoint.
#
# The --filter narrows resolution to openwiki's own keys. Without it a wiki run also pulls
# CLAUDE_CODE_OAUTH_TOKEN and the scanner tokens out of 1Password and exports them into a process
# that talks to a third-party inference endpoint.
#
# RUN THESE FROM main/, NOT FROM A WORKTREE. docs/ is a gitignored live clone of the GitHub wiki, so
# a worktree checkout does not have it and the generated wiki would be written from an incomplete
# view of the project's own documentation.
#
# `interactive = true` throughout: openwiki's UI is Ink, which needs the real stdin/stdout. Under
# mise's default output capture a prompt draws but cannot be answered, so it re-prompts forever.
[vars]
# LANGSMITH_API_KEY is in the filter because tracing without it silently exports nothing — the
# client gets LANGCHAIN_TRACING_V2=true but no credentials. That combination cost a full 13h run
# of instrumentation before it was noticed (2026-09-04).
openwiki_env = "varlock run -p $HOME/.config/harnessed --filter 'OPENWIKI_*,OPENAI_COMPATIBLE_*,LANGCHAIN_TRACING_V2,LANGSMITH_API_KEY' --"

# Not interactive, no varlock, no model: it recomputes each Claim's evidence digest against the tree
# and exits non-zero when cited code actually changed. That makes "which pages are lying" a check
# rather than a regeneration, so it is the cheap thing to run before deciding to run openwiki-update.
[tasks.openwiki-drift]
description = "Report which openwiki Claims cite code that has changed (exit 1 when any have)"
run = "tools/openwiki-drift.py"

# THE ENTRY POINT, including for the very first run: upstream's own CI example notes that
# `--update` "also handles the first run for code docs when env vars are set", and unlike `--init`
# it does not force the setup wizard. --print makes it one-shot and exits.
[tasks.openwiki-update]
description = "Generate or refresh openwiki/ with no prompts (handles the first run too)"
interactive = true
run = "{{vars.openwiki_env}} openwiki code --update --print"

# DELIBERATELY INTERACTIVE. `--init` walks every setup step unconditionally — dist/cli/app/app.js:96
# is `needsCredentialSetup(...) || (isInitCommand && !initWizardConsumed)` — so a fully configured
# environment does NOT skip it. Use this only to reconfigure or to discard the generated wiki and
# start over; use openwiki-update for ordinary generation.
[tasks.openwiki-init]
description = "Discard the generated wiki and reconfigure from scratch (walks the setup wizard)"
interactive = true
run = "{{vars.openwiki_env}} openwiki --init"

[tasks.openwiki-chat]
description = "Interactive openwiki session against this repository"
interactive = true
run = "{{vars.openwiki_env}} openwiki"

# No credential and no varlock: this only serves the Markdown already on disk, so routing it through
# `varlock run` would touch 1Password for nothing.
[tasks.openwiki-visualize]
description = "Serve the openwiki/ graph and Markdown reader on 127.0.0.1"
interactive = true
run = "openwiki visualize"
